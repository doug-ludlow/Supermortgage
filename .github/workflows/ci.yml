name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: sm, POSTGRES_PASSWORD: sm, POSTGRES_DB: supermortgage }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sm" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run spec:lint
      - name: migrations apply cleanly
        env: { DATABASE_URL: postgresql://sm:sm@localhost:5432/supermortgage }
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          db/migrate.sh
          db/migrate.sh | grep -c skip
