/* Servicing layout. Shared components and typography live in ui.css. */
.my-loan,.loan-sheet{font-size:var(--body-size);line-height:1.35;letter-spacing:-.2px}
#panel .my-loan h1{font-size:var(--title-size);line-height:var(--title-line);font-weight:500;margin:0 0 6px}
.my-loan p,.loan-sheet p{margin:8px 0 14px}
.my-loan .loan-address{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);margin:0}
.loan-link{border:0;background:none;color:var(--accent);padding:10px 0;min-height:44px;font-size:var(--support-size);line-height:var(--support-line);text-align:left}
.loan-demo-link{font-size:var(--meta-size);line-height:var(--meta-line);color:var(--muted);padding:7px 0;min-height:34px}
.loan-status{position:sticky;top:0;z-index:9;background:var(--paper-glass);backdrop-filter:blur(18px);padding:14px 0 13px;border-bottom:1px solid var(--line);margin-bottom:22px}
.loan-badge{display:inline-block;background:var(--bubble);border-radius:50px;padding:5px 11px;font-size:var(--support-size);font-weight:500;line-height:var(--support-line)}
.loan-status.is-attention .loan-badge{background:var(--accent-soft);color:var(--accent)}
.loan-status p{font-size:var(--support-size);line-height:var(--support-line);margin:9px 0 0}
.loan-status .loan-link{padding:6px 0 0;min-height:32px}

.loan-number-label{display:block;font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);margin-bottom:3px}
.loan-balance{font-size:34px;line-height:41px;font-weight:500;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:0 0 22px;overflow-wrap:anywhere}

.loan-cta{margin:22px 0 0;text-align:center}
.loan-cta .loan-link{display:block;margin:auto;text-align:center}
.loan-button{display:block;width:100%;background:var(--accent);color:var(--surface);border:0;border-radius:100px;min-height:44px;padding:12px 18px;font-size:var(--body-size);line-height:var(--body-line);text-align:center;font-weight:500;margin-top:12px}
.loan-button.secondary{background:var(--bubble);color:inherit}
.loan-button:disabled{opacity:.42}
.loan-needs{scroll-margin-top:145px;margin:20px 0 26px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.loan-needs h2,.loan-recent h2{font-size:var(--body-size);line-height:var(--body-line);font-weight:600;margin:0 0 10px}
.loan-needs p{margin:0;font-size:var(--support-size);line-height:var(--support-line);color:var(--muted)}
.loan-need{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;min-height:48px;padding:10px 0;font-size:var(--support-size);line-height:var(--support-line)}
.loan-need svg{width:18px;height:18px;color:var(--muted)}
.loan-accordion{border-bottom:1px solid var(--line);padding:0;margin:0}
.loan-accordion>summary{min-height:72px;padding:17px 0;font-size:var(--body-size);line-height:var(--body-line);font-weight:500;gap:15px}
.loan-accordion>summary .loan-subtitle{display:block;font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);font-weight:400;margin-top:3px}
.loan-accordion>summary:after{font-size:23px;flex-shrink:0}
.loan-accordion-body{padding:0 0 18px}
.loan-accordion-body>p{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted)}
.loan-small{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted)}
.loan-muted{color:var(--muted)}
.loan-note{font-size:var(--support-size);line-height:var(--support-line);border-radius:18px;background:var(--bubble);padding:15px 16px;margin:14px 0}
.loan-note.attention{background:var(--accent-soft)}
.loan-note strong{font-weight:500;display:block;margin-bottom:5px}
.loan-note p:last-child{margin-bottom:0}
.loan-escrow-item{padding:9px 0 13px;font-size:var(--support-size);line-height:var(--support-line);border-bottom:1px solid var(--line)}
.loan-escrow-item strong{display:block;font-weight:500}
.loan-escrow-item small{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);display:block;margin-top:3px}
.loan-mini-history{margin-top:14px}
.loan-mini-history p{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);margin:10px 0}
.loan-rates{display:flex;justify-content:space-between;gap:16px;margin:8px 0 12px}
.loan-rates span{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);display:block}
.loan-rates strong{display:block;font-size:26px;line-height:32px;font-weight:500;letter-spacing:-.6px;margin-top:4px}
.loan-recent{margin:32px 0 0}
.loan-event{border-bottom:1px solid var(--line);margin:0;padding:13px 0;font-size:var(--support-size);line-height:var(--support-line)}
.loan-event>summary{font-size:var(--support-size);line-height:var(--support-line);min-height:42px}
.loan-event time{display:block;color:var(--muted);font-size:var(--meta-size);line-height:var(--meta-line);margin-top:4px}
.loan-event .loan-kv{font-size:var(--support-size);line-height:var(--support-line);padding:5px 0}
.loan-field{display:block;margin:18px 0}
.loan-field>span{display:block;color:var(--muted);font-size:var(--support-size);line-height:var(--support-line);margin-bottom:6px}
.loan-field input,.loan-field select{display:block;width:100%;min-width:0;border:1px solid var(--field-line);border-radius:8px;background:transparent;padding:10px 12px;min-height:44px;font-size:var(--body-size);line-height:var(--body-line)}
.loan-check{display:flex;align-items:flex-start;gap:10px;min-height:44px;margin:16px 0;font-size:var(--support-size);line-height:var(--support-line)}
.loan-check input{flex-shrink:0;accent-color:var(--accent);width:20px;height:20px;min-height:20px;margin:1px 0 0}
.loan-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;background:transparent;width:100%;padding:14px;text-align:left;font-size:var(--body-size);line-height:var(--body-line);min-height:50px;margin:9px 0}
.loan-choice[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.loan-choice small{display:block;font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);margin-top:3px}
.loan-error{font-size:var(--support-size);line-height:var(--support-line);color:var(--accent);margin:12px 0 0}
.loan-error:empty{display:none}
.loan-consent-element{padding:8px 0;border-bottom:1px solid var(--line);font-size:var(--support-size);line-height:var(--support-line)}
.loan-consent-element strong{font-weight:500;display:block;margin-bottom:2px}
.loan-consent-element span{color:var(--muted)}
.loan-sheet .loan-success-icon{display:grid;place-items:center;background:var(--bubble);border-radius:50%;width:44px;height:44px;margin:0 0 14px}
.loan-sheet .loan-success-icon svg{width:23px;height:23px}
.loan-sheet h3{font-size:var(--body-size);line-height:var(--body-line);font-weight:500;margin:18px 0 8px}
.loan-person{padding:10px 0;font-size:var(--body-size);line-height:23px}
.loan-person strong{display:block;font-weight:500}
.loan-person span{display:block;font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);margin-top:4px}
.loan-document{padding:18px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.loan-payoff-total{font-size:32px;line-height:39px;font-weight:500;letter-spacing:-.8px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.loan-sheet .loan-disclosure{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);margin:16px 0}
@media(max-width:360px){.loan-balance{font-size:32px}.loan-rates strong{font-size:var(--title-size)}.loan-kv{gap:12px}.loan-button{padding-left:12px;padding-right:12px}}

/* Account layout. Colors and components are shared across the app. */
.account-demo{border:0;background:none;color:var(--muted);padding:8px 0 6px;font-size:var(--meta-size);line-height:17px;min-height:34px;text-align:left}
.account-section{margin:27px 0 0}
.account-section>h2{font-size:var(--body-size);line-height:var(--body-line);font-weight:600;margin:0 0 6px}
.account-row{display:flex;align-items:center;gap:10px;width:100%;min-height:64px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left;padding:13px 0}
.account-row .account-row-copy{flex:1;min-width:0}
.account-row strong{font-size:var(--body-size);line-height:var(--body-line);font-weight:400;display:block}
.account-row small{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);display:block;margin-top:4px;overflow-wrap:anywhere}
.account-row>svg{width:17px;height:17px;color:var(--muted)}
.account-row:disabled{opacity:.55}
.account-receipt{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);margin:12px 0 0}
.account-switch{width:34px;height:21px;flex-shrink:0;background:var(--quiet);border-radius:50px;position:relative;margin:0 1px}
.account-switch:before{content:'';position:absolute;left:3px;top:3px;width:15px;height:15px;background:var(--surface);border-radius:50%}
.account-switch.on{background:var(--accent)}
.account-switch.on:before{left:16px}
.account-link{border:0;background:none;color:var(--muted);padding:11px 0;min-height:44px;font-size:var(--support-size);line-height:var(--support-line);text-align:left}
.account-button{display:block;width:100%;border:0;border-radius:100px;background:var(--accent);color:white;padding:12px 17px;min-height:46px;font-size:var(--body-size);line-height:var(--body-line);font-weight:500;margin:12px 0 0;text-align:center}
.account-button.secondary{background:var(--bubble);color:var(--text)}
.account-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:1px solid var(--line);border-radius:14px;background:var(--bubble);color:var(--text);padding:14px;text-align:left;min-height:50px;font-size:var(--body-size);line-height:var(--body-line);margin:9px 0}
.account-choice[aria-pressed=true]{border-color:var(--accent-text)}
.account-sheet{padding:0 0 4px}
.account-sheet p{margin:8px 0 14px}
.account-sheet .account-small{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted)}
.account-sheet h3{font-size:var(--body-size);line-height:var(--body-line);font-weight:500;margin:20px 0 8px}
.account-field{display:block;margin:18px 0}
.account-field>span{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);display:block;margin:0 0 6px}
.account-field input,.account-field select{display:block;width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-size:var(--body-size);line-height:var(--body-line);min-height:46px;padding:11px}
.account-check{display:flex;align-items:flex-start;gap:10px;font-size:var(--support-size);line-height:var(--support-line);min-height:44px;margin:16px 0}
.account-check input{width:20px;height:20px;min-height:20px;flex-shrink:0;accent-color:var(--accent);margin:1px 0 0}
.account-note{background:var(--bubble);padding:15px 16px;border-radius:18px;font-size:var(--support-size);line-height:var(--support-line);margin:14px 0}
.account-note.attention{background:var(--accent-soft)}
.account-note strong{display:block;font-weight:500;margin-bottom:5px}
.account-error{font-size:var(--support-size);line-height:var(--support-line);color:var(--accent-text);margin:12px 0 0}
.account-error:empty{display:none}
.account-success{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--bubble);margin-bottom:14px}
.account-people-row{padding:13px 0;border-bottom:1px solid var(--line);font-size:var(--body-size);line-height:var(--body-line)}
.account-people-row small{display:block;font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);margin-top:4px}
.account-theme-options{display:flex;gap:8px;padding:12px 0}
.account-theme-options button{flex:1;border:1px solid var(--line);border-radius:100px;background:none;color:var(--muted);padding:9px 15px;min-height:44px;font-size:var(--support-size);line-height:var(--support-line)}
.account-theme-options button[aria-pressed=true]{background:var(--bubble);color:var(--text);border-color:var(--muted)}
.account-view a,.account-sheet a{color:var(--accent-text)}
.account-view :focus-visible,.account-sheet :focus-visible{outline-color:var(--accent-text)}
/* Sign-out reuses the shared native sheet in a full-height layout. */
#sheet:has(.account-signedout){inset:0;margin:auto;height:100svh;max-height:100svh;border-radius:0;padding:24px;max-width:430px}
#sheet:has(.account-signedout) .sheet-head,#sheet:has(.account-signedout) .sheet-handle{display:none}
.account-signedout{display:flex;flex-direction:column;justify-content:center;min-height:calc(100svh - 48px);padding:0 8px;text-align:center}
.account-signedout h2{font-size:28px;line-height:34px;font-weight:500;margin:0 0 10px}
.account-signedout .account-button{margin-top:32px}

/* Canonical components shared by Chat, Activity, My Loan, Tasks, Account and sheets.
   Section CSS owns layout/content only. Add shared visual changes here. */
:where(.my-loan,.loan-sheet,.account-view,.account-sheet) {
  font:400 var(--body-size)/var(--body-line) var(--font-ui);
  letter-spacing:var(--body-tracking); color:var(--text);
}
/* A dedicated Muse conversation. Application forms have no chat composer or tail. */
main:not(.onboarding-screen){padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.home-screen .flow-bubble{margin-right:0;max-width:none}
.flow-bubble{border-radius:var(--card-radius)}
#chat-panel{padding:12px var(--gutter) calc(160px + env(safe-area-inset-bottom));outline:none}
.chat-thread{display:flex;flex-direction:column;gap:0;min-width:0}
.chat-message{width:fit-content;max-width:calc(100% - 22px);margin:6px 22px 0 0;scroll-margin-bottom:calc(160px + env(safe-area-inset-bottom))}
.chat-message.user{align-self:flex-end;margin:6px 0 0 32px;max-width:calc(100% - 32px)}
.chat-message:has(.chat-options){width:100%}
.chat-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--body-size);line-height:var(--body-line)}
.chat-options{display:grid;gap:8px;margin-top:12px}
.chat-choice{width:100%;min-height:var(--control-height);padding:9px 10px;border:1px dashed var(--choice-line);border-radius:var(--field-radius);background:transparent;color:var(--text);font:400 var(--body-size)/var(--body-line) var(--font-ui);letter-spacing:var(--body-tracking);text-align:left}
.chat-choice:active{background:var(--subtle)}
.chat-attachment{display:flex;align-items:center;gap:8px;min-width:0;font-size:var(--support-size);line-height:var(--support-line)}
.chat-attachment span{overflow-wrap:anywhere;min-width:0}
.chat-attachment svg{width:20px;height:20px}
#panel {padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.account-view {padding:0;margin:0;border-radius:0;min-height:0;background:transparent}
#panel h1,#panel .my-loan h1,#panel .account-view h1 {
  font-size:var(--title-size);line-height:var(--title-line);font-weight:600;
  letter-spacing:var(--title-tracking);margin:0 0 24px;
}
#panel .my-loan h1 {margin-bottom:6px}
.account-section {margin-top:28px}
.account-section>h2,.loan-needs h2,.loan-recent h2 {
  font-size:var(--body-size);line-height:var(--body-line);font-weight:600;
  letter-spacing:var(--body-tracking);margin:0 0 8px;
}
.sheet-head h2 {
  font-size:var(--sheet-size);line-height:var(--sheet-line);font-weight:600;
  letter-spacing:-.5px;
}
.loan-sheet h3,.account-sheet h3 {font-size:var(--body-size);line-height:var(--body-line);font-weight:600;margin:20px 0 8px}
:is(.primary,.secondary,.loan-button,.account-button) {
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:var(--control-height);padding:10px 16px;border:0;border-radius:var(--pill-radius);
  font:500 var(--body-size)/var(--body-line) var(--font-ui);letter-spacing:-.35px;
  background:var(--button);color:#fff;text-align:center;
}
:is(.primary,.loan-button,.account-button):active {background:var(--accent-pressed)}
:is(.secondary,.loan-button.secondary,.account-button.secondary) {background:var(--bubble);color:var(--text)}
.flow-bubble>.secondary,.flow-bubble .cta>.secondary {background:var(--surface)}
:is(.primary,.secondary,.loan-button,.account-button):disabled {opacity:.42}
.loan-button,.account-button {margin:12px 0 0}
:is(.link,.loan-link,.account-link) {
  display:inline-flex;align-items:center;gap:5px;background:none;border:0;
  min-height:var(--control-height);padding:10px 0;
  font:400 var(--support-size)/var(--support-line) var(--font-ui);letter-spacing:var(--body-tracking);
  color:var(--muted);text-align:left;
}
.link.blue {color:var(--accent)}
:is(.loan-demo-link,.account-demo) {font:400 var(--meta-size)/var(--meta-line) var(--font-ui);color:var(--muted);min-height:44px;padding:10px 0}
:is(.choice,.loan-choice,.account-choice) {
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;min-height:64px;padding:14px 12px;border:1px solid var(--line);
  border-radius:var(--choice-radius);background:var(--surface);color:var(--text);
  font:400 var(--body-size)/var(--body-line) var(--font-ui);letter-spacing:var(--body-tracking);text-align:left;
}
:is(.loan-choice,.account-choice) {margin:8px 0}
:is(.choice.selected,.loan-choice[aria-pressed=true],.account-choice[aria-pressed=true]) {border-color:var(--accent);background:var(--accent-soft)}
.home-screen .choice {min-height:44px;padding:9px 10px;border:1px dashed var(--choice-line);border-radius:var(--field-radius);background:transparent}
:is(.field,.loan-field input,.loan-field select,.account-field input,.account-field select) {
  border:1px solid var(--field-line);border-radius:var(--field-radius);background:transparent;color:var(--text);
  min-height:var(--control-height);font:400 var(--body-size)/var(--body-line) var(--font-ui);
}
:is(.loan-field input,.loan-field select,.account-field input,.account-field select) {padding:10px}
:is(.form-group>span:first-child,.loan-field>span,.account-field>span) {
  font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);margin-bottom:6px;
}
:is(.check,.loan-check,.account-check) {font-size:var(--support-size);line-height:var(--support-line);gap:10px}
:is(.check input,.loan-check input,.account-check input) {width:19px;height:19px;min-height:19px;accent-color:var(--button)}
:is(.card,.panel-card,.loan-document) {
  background:var(--surface);border:1px solid var(--card-line);border-radius:var(--card-radius);
  padding:18px;box-shadow:var(--card-shadow);
}
:is(.note,.loan-note,.account-note) {
  background:var(--bubble);color:var(--text);border-radius:var(--bubble-radius);
  padding:14px 16px;margin:16px 0;font-size:var(--support-size);line-height:var(--support-line);
}
:is(.note.warning,.loan-note.attention,.account-note.attention) {background:var(--accent-soft);color:var(--accent-text)}
:is(.panel-row,.account-row) {min-height:64px;padding:16px 0;gap:12px;border-bottom:1px solid var(--line)}
:is(.panel-row strong,.account-row strong,.loan-accordion>summary) {font-size:var(--body-size);line-height:var(--body-line);font-weight:400;letter-spacing:var(--body-tracking)}
:is(.panel-row small,.account-row small,.account-people-row small,.account-receipt,.loan-small,.account-small,.loan-choice small,.loan-escrow-item small,.loan-mini-history p,.loan-rates span,.loan-event .loan-kv,.loan-consent-element,.loan-sheet .loan-disclosure,.account-sheet .account-small) {
  font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);
}
:is(.panel-row small,.account-row small,.account-people-row small,.loan-choice small) {margin-top:4px}
:is(.panel-row>svg:last-child,.account-row>svg,.loan-need svg) {width:16px;height:16px;color:var(--quiet)}
.loan-accordion>summary {min-height:72px;padding:16px 0}
:is(.loan-accordion,.account-row,.account-people-row,.loan-escrow-item,.loan-event,.loan-consent-element) {border-color:var(--line)}
:is(.loan-event time,.loan-demo-link,.account-demo) {font-size:var(--meta-size);line-height:var(--meta-line)}
:is(.loan-success-icon,.loan-sheet .loan-success-icon,.account-success) {width:44px;height:44px;background:var(--bubble);border-radius:50%}
:is(.loan-success-icon,.account-success)>svg {width:24px;height:24px}
:is(.loan-error,.account-error) {color:var(--accent-text);font-size:var(--support-size);line-height:var(--support-line)}
.loan-numbers {padding:0}
.account-theme-options {
  display:flex;gap:4px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--pill-radius);padding:5px;margin:12px 0;
}
.account-theme-options button {min-height:36px;padding:7px 8px;border:0;color:var(--text)}
.account-theme-options button[aria-pressed=true] {background:var(--subtle);color:var(--text);font-weight:600}
.account-switch {background:var(--quiet)}
.account-switch.on {background:var(--button)}
.account-switch:before {background:#fff}
.composer:has(input:not(:placeholder-shown)) .send {background:var(--button);color:#fff}
.account-sheet p,.loan-sheet p {margin:0 0 16px;line-height:var(--support-line)}
.activity,.loan-event {font-size:var(--body-size);line-height:var(--body-line)}
.loan-event>summary {font-size:var(--body-size);line-height:var(--body-line)}
@media(max-width:360px) {
  .account-view {padding:0}
  .account-row strong {font-size:var(--body-size)}
}

/* ===================== Agent shell (Muse-style) ===================== */
.ag-phone{width:100%;max-width:430px;min-height:100svh;margin:0 auto;background:var(--paper);position:relative}
@media(min-width:600px){.ag-phone{box-shadow:0 0 70px #00000005}}
.ag-header{height:calc(128px + env(safe-area-inset-top));padding:calc(16px + env(safe-area-inset-top)) 20px 0;position:sticky;top:0;z-index:10;background:linear-gradient(var(--paper) 82%,var(--paper-glass) 92%,transparent)}
.ag-header>.icon-button,.ag-header>.header-action{position:absolute;top:calc(16px + env(safe-area-inset-top));background:var(--chrome);box-shadow:var(--shadow);backdrop-filter:blur(20px);border:1px solid var(--surface)}
.ag-header>.icon-button{left:20px}
.ag-header>.icon-button svg{width:26px;height:26px}
.ag-header>.header-action{right:16px}
.ag-avatar-btn{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);border:0;background:none;display:flex;flex-direction:column;align-items:center;padding:0;z-index:1;width:280px}
.ag-avatar{width:66px;height:66px;display:block;position:relative;filter:drop-shadow(0 6px 10px #00000014)}
.ag-avatar svg{width:66px;height:66px;stroke:none;fill:none}
.ag-avatar.working::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1.5s linear infinite}
.ag-name{margin-top:-9px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.ag-snippet{font-size:var(--meta-size);line-height:var(--meta-line);color:var(--muted);margin-top:6px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
#ag-view{padding:4px var(--gutter) calc(165px + env(safe-area-inset-bottom));outline:none}
#ag-view.ag-onboarding{padding:0}
.ag-screen{animation:enter .16s ease}
.ag-screen>h1{font-size:var(--title-size);line-height:var(--title-line);letter-spacing:var(--title-tracking);font-weight:600;margin:12px 0 18px}
.ag-footer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;z-index:11;padding:14px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper-fade) 55%);pointer-events:none}
.ag-footer>*{pointer-events:auto}
@media(min-width:600px){.ag-footer{padding-bottom:20px}}
.ag-onboarding main.onboarding-screen{max-width:430px;margin:0 auto}
.welcome-spinner{margin:34svh auto 0}
.ag-terms{font-size:var(--meta-size);line-height:var(--meta-line);color:var(--muted);text-align:left;margin:0 0 16px}
.ag-terms a{color:var(--accent-text);text-decoration:none}
.ag-setup{min-height:100svh;display:grid;place-items:center;text-align:center;padding:0 20px}
.ag-setup h1{font-size:28px;line-height:34px;font-weight:500;margin:26px 0 0}

/* ===================== Segmented control ===================== */
.ag-seg{display:flex;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:5px;margin:0 0 18px}
.ag-seg button{flex:1;min-height:38px;border:0;border-radius:100px;background:transparent;color:var(--muted);font-size:var(--support-size);line-height:var(--support-line);font-weight:500;padding:0 6px;letter-spacing:-.2px}
.ag-seg button[aria-pressed=true]{background:var(--subtle);color:var(--text);font-weight:600}
.ag-seg .n{color:var(--quiet);font-weight:400;margin-left:4px}

/* ===================== Chat extras ===================== */
.ag-thread{padding-top:8px}
.chat-message.assistant{max-width:calc(100% - 22px)}
.message ul{margin:8px 0 0;padding-left:18px}
.message li{margin:6px 0}
.message .kv{margin-top:12px;border-top:1px solid #00000012;padding-top:4px}
:root[data-theme=dark] .message .kv{border-top-color:#ffffff14}
.message .kv .list-row{border-top-color:#00000010;padding:8px 0}
:root[data-theme=dark] .message .kv .list-row{border-top-color:#ffffff10}
.message .big{font-size:26px;line-height:30px;font-weight:600;letter-spacing:-.8px;display:block;margin:6px 0 2px}
.ag-typing{display:inline-flex;gap:5px;padding:4px 2px}
.ag-typing i{width:7px;height:7px;border-radius:50%;background:var(--quiet);animation:agBlink 1.2s infinite}
.ag-typing i:nth-child(2){animation-delay:.2s}.ag-typing i:nth-child(3){animation-delay:.4s}
@keyframes agBlink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chat-message .status-row{padding:10px 0 0;border:0}
.chat-message .status-row small{color:var(--muted)}
.chat-choice.primaryish{border-style:solid;border-color:var(--accent);color:var(--accent-text);font-weight:500}
.ag-date-sep{text-align:center;font-size:var(--meta-size);color:var(--quiet);margin:18px 0 6px}

/* ===================== Feed ===================== */
.ag-day{font-size:var(--title-size);line-height:var(--title-line);letter-spacing:var(--title-tracking);font-weight:600;margin:12px 0 14px}
.ag-post{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.ag-post .ico{font-size:30px;line-height:1;text-align:center;padding-top:1px}
.ag-post h3{font-size:var(--body-size);line-height:var(--body-line);font-weight:600;letter-spacing:-.3px;margin:0 0 6px}
.ag-post p{margin:0;font-size:var(--support-size);line-height:var(--support-line);color:var(--muted)}
.ag-post .acts{display:flex;align-items:center;gap:18px;margin-top:12px}
.ag-post .acts button{background:none;border:0;display:inline-flex;align-items:center;gap:6px;color:var(--text);font-size:var(--support-size);padding:0;min-height:28px}
.ag-post .acts button svg{width:22px;height:22px}
.ag-post .acts .grow{flex:1}
.ag-post .acts button.on svg{fill:var(--accent);stroke:var(--accent)}
.ag-tag{display:inline-block;font-size:var(--meta-size);line-height:var(--meta-line);color:var(--accent-text);background:var(--accent-soft);padding:2px 8px;border-radius:100px;margin-left:6px;vertical-align:2px;font-weight:500}
.ag-textarea{width:100%;min-height:96px;border:1px solid var(--field-line);border-radius:12px;padding:10px 12px;font:inherit;font-size:var(--support-size);line-height:var(--support-line);background:transparent;color:inherit;resize:vertical}
.ag-instr{background:var(--surface);border:1px solid var(--card-line);border-radius:var(--card-radius);padding:18px;box-shadow:var(--card-shadow);margin:0 0 6px}
.ag-instr h3{margin:0 0 6px}
.ag-instr .intro{margin:0 0 12px}
.ag-instr .prompt{font-size:var(--support-size);line-height:var(--support-line);border-top:1px solid var(--line);padding:12px 0 14px}
.ag-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ===================== Work ===================== */
.ag-count{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);margin:-8px 0 16px}
.ag-group>h2{font-size:var(--body-size);line-height:var(--body-line);font-weight:600;letter-spacing:-.3px;margin:14px 0 2px;display:flex;align-items:center;gap:8px}
.ag-row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;color:inherit}
.ag-row:active{background:var(--subtle)}
.ag-row .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex-shrink:0;background:var(--quiet);box-sizing:border-box}
.ag-row .dot.run{background:var(--text)}
.ag-row .dot.need{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ag-row .dot.done{background:var(--muted)}
.ag-row .dot.wait{background:transparent;border:2px solid var(--quiet)}
.ag-row .dot.conn{background:transparent;border:2px dashed var(--accent)}
.ag-row .dot.na{background:transparent;border:1px solid var(--line)}
.ag-row .copy{flex:1;min-width:0}
.ag-row strong{display:block;font-size:var(--body-size);line-height:var(--body-line);font-weight:500;letter-spacing:-.3px}
.ag-row .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px;font-size:var(--meta-size);line-height:var(--meta-line);color:var(--muted)}
.ag-row .last{margin-top:4px;font-size:var(--meta-size);line-height:var(--meta-line);color:var(--quiet)}
.ag-row .amt{font-weight:600;font-size:var(--support-size);line-height:var(--support-line);white-space:nowrap;margin-top:1px;text-align:right}
.ag-row .amt small{display:block;font-weight:400;color:var(--muted);font-size:var(--meta-size)}
.ag-row.na{opacity:.62}
.ag-chip{display:inline-block;font-size:var(--meta-size);line-height:var(--meta-line);padding:1px 8px;border-radius:100px;background:var(--subtle);color:var(--muted)}
.ag-chip.need{background:var(--accent-soft);color:var(--accent-text);font-weight:500}
.ag-chip.run{background:var(--selected);color:var(--text)}
.ag-chip.done{background:var(--subtle);color:var(--muted)}
.ag-chip.conn{background:transparent;border:1px dashed var(--accent);color:var(--accent-text)}
details.ag-na{border:0;margin:6px 0 0}
details.ag-na summary{color:var(--muted);padding:12px 0}
.ag-hist{margin:0;padding:0;list-style:none}
.ag-hist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:var(--support-size);line-height:var(--support-line)}
.ag-hist li span{color:var(--muted);white-space:nowrap}
.ag-sheet-section{margin:18px 0 0}
.ag-sheet-section>h3{font-size:var(--body-size);line-height:var(--body-line);font-weight:600;margin:0 0 6px}
.ag-sheet-section>p{margin:0;font-size:var(--support-size);line-height:var(--support-line);color:var(--muted)}
.ag-actions{display:grid;gap:10px;margin-top:20px}

/* ===================== Goals ===================== */
.ag-number{font-size:44px;line-height:48px;font-weight:600;letter-spacing:-1.6px;margin:2px 0 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ag-number small{font-size:var(--body-size);line-height:var(--body-line);font-weight:400;color:var(--muted);letter-spacing:-.3px}
.ag-number .arrow{color:var(--quiet);font-weight:400;font-size:26px}
.ag-label{font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);margin:0}
.ag-bar{height:10px;border-radius:100px;background:var(--subtle);overflow:hidden;display:flex;margin:16px 0 8px}
.ag-bar i{display:block;height:100%}
.ag-bar .d{background:var(--accent)}.ag-bar .p{background:#e08a8f}.ag-bar .o{background:var(--accent-soft)}
:root[data-theme=dark] .ag-bar .p{background:#a8474d}
.ag-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--meta-size);line-height:var(--meta-line);color:var(--muted)}
.ag-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.ag-legend .d{background:var(--accent)}.ag-legend .p{background:#e08a8f}.ag-legend .o{background:var(--accent-soft);outline:1px solid var(--card-line)}
.ag-spark{width:100%;height:60px;display:block;margin:14px 0 0;stroke:none;fill:none}
.ag-sub{display:flex;gap:12px;align-items:center;padding:16px 0;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;color:inherit}
.ag-sub .copy{flex:1;min-width:0}
.ag-sub strong{display:block;font-weight:600;font-size:var(--body-size);line-height:var(--body-line);letter-spacing:-.3px}
.ag-sub small{display:block;color:var(--muted);font-size:var(--support-size);line-height:var(--support-line);margin-top:3px}
.ag-sub .val{font-weight:600;font-size:var(--support-size);white-space:nowrap}
.ag-sub .val small{display:block;text-align:right;margin-top:2px;font-size:var(--meta-size)}
.ag-goal-cat{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:var(--body-size);color:inherit;letter-spacing:-.3px}
.ag-goal-cat .l{display:flex;align-items:center;gap:12px}
.ag-goal-cat svg{width:20px;height:20px;color:var(--quiet)}
.ag-next{margin:0;padding:0;list-style:none}
.ag-next li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:var(--support-size);line-height:var(--support-line)}
.ag-next li span{color:var(--muted);white-space:nowrap}
.ag-h2{font-size:var(--body-size);line-height:var(--body-line);font-weight:600;letter-spacing:-.3px;margin:26px 0 4px}
.ag-h2+.intro{margin-bottom:6px}

/* ===================== Artifacts ===================== */
.ag-art{display:flex;gap:14px;align-items:center;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:inherit}
.ag-art .copy{flex:1;min-width:0}
.ag-art strong{display:block;font-size:var(--body-size);line-height:var(--body-line);font-weight:500;letter-spacing:-.3px}
.ag-art small{display:block;color:var(--muted);font-size:var(--support-size);line-height:var(--support-line);margin-top:3px}
.ag-thumb{width:54px;height:66px;border-radius:12px;background:var(--surface);border:1px solid var(--card-line);display:grid;place-items:center;flex-shrink:0;color:var(--quiet);box-shadow:var(--card-shadow)}
.ag-thumb svg{width:22px;height:22px}
.ag-thumb.live{border-color:var(--accent);color:var(--accent)}
.ag-media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ag-media{aspect-ratio:3/4;border-radius:14px;background:var(--surface);border:1px solid var(--card-line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 8px;font-size:var(--meta-size);line-height:var(--meta-line);color:var(--muted);gap:8px;box-shadow:var(--card-shadow)}
.ag-media svg{width:26px;height:26px;color:var(--quiet)}
.ag-preview{border:1px solid var(--card-line);border-radius:20px;padding:16px;background:var(--surface);margin-top:6px}
.ag-preview h3{margin:0 0 10px}
.ag-preview .fine{margin:12px 0 0}
.ag-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ag-col{border:1px solid var(--line);border-radius:14px;padding:12px}
.ag-col h4{margin:0 0 8px;font-size:var(--support-size);font-weight:600}
.ag-col .list-row{font-size:var(--meta-size);padding:6px 0}
.ag-letter{font-size:var(--support-size);line-height:var(--support-line);white-space:pre-wrap;color:var(--text)}

/* ===================== Sheets: avatar / settings / approvals ===================== */
.ag-approve{border:1px solid var(--card-line);border-radius:20px;padding:16px;background:var(--surface)}
.ag-approve h3{margin:0 0 4px}
.ag-approve .intro{margin:0 0 8px}
.ag-switch{position:relative;display:inline-block;width:46px;height:28px;flex-shrink:0}
.ag-switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.ag-switch span{position:absolute;inset:0;border-radius:100px;background:var(--line);transition:.15s}
.ag-switch span::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.15s}
.ag-switch input:checked+span{background:var(--button)}
.ag-switch input:checked+span::after{transform:translateX(18px)}
.ag-switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.ag-perm{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ag-perm .copy{flex:1;min-width:0}
.ag-perm strong{display:block;font-weight:500;font-size:var(--support-size);line-height:var(--support-line)}
.ag-perm small{display:block;color:var(--muted);font-size:var(--meta-size);line-height:var(--meta-line);margin-top:2px}
.ag-status-line{display:flex;align-items:center;gap:10px;font-size:var(--support-size);line-height:var(--support-line);color:var(--muted);margin:-8px 0 14px}
.ag-radio{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--support-size);line-height:var(--support-line)}
.ag-radio input{accent-color:var(--button);width:19px;height:19px;margin:1px 0 0;flex-shrink:0}
.ag-radio small{display:block;color:var(--muted);font-size:var(--meta-size);line-height:var(--meta-line);margin-top:2px}
.ag-menu-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:inherit;font-size:var(--body-size);letter-spacing:-.3px}
.ag-menu-row svg{width:22px;height:22px;color:var(--quiet)}
.ag-menu-row .copy{flex:1;min-width:0}
.ag-menu-row small{display:block;color:var(--muted);font-size:var(--support-size);line-height:var(--support-line);margin-top:2px}
.ag-menu-row .arrow{width:16px;height:16px}
.ag-cost-total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--text);margin-top:10px;padding-top:10px;font-weight:600}
.ag-muted{color:var(--muted)}
.ag-plaid-bank{display:flex;align-items:center;gap:12px;margin:0 0 6px}

};
const SCENARIOS=[['current','Current + autopay'],['off','Autopay off · payment due'],['late','Past due + late charge'],['nsf','Autopay suspended'],['shortage','Escrow shortage'],['insurance','Insurance force-place'],['behind','Behind + team'],['plan','Payment plan · 2 of 3'],['offer','Offer ready'],['paid','Paid off']];
const NEEDS={shortage:{id:'shortage',label:'Choose how to cover your escrow shortage',action:'shortage',command:'escrow.electShortage'},insurance:{id:'insurance',label:'Send your home insurance policy',action:'insurance',command:'insurance.submitEvidence'},nsf:{id:'nsf',label:'Choose how to make your payment',action:'suspended',command:'autodraft.change'},offer:{id:'offer',label:'Review your refinance offer',action:'offer',command:'offer.respond'},behind:{id:'behind',label:'Tell us if you need payment help',action:'hardship',command:'lossmit.requestAssistance'}};

function fixture(id){
  const s=clone(BASE);s.scenario=id;
  if(id==='off'){s.loan.autodraft.status='none';s.loan.autodraft.next_draft_label=null;s.status={badge:'Payment due',state_source:'installment.due_date_reached',one_liner:'$2,412.18 due Oct 1 · grace period ends Oct 16'};s.display.today='Oct 1, 2026';s.display.today_iso='2026-10-01';}

  if(id==='nsf'){s.loan.autodraft.status='suspended_returns';s.status={badge:'Payment due',state_source:'ach.return.received',one_liner:'Payment returned · autopay needs your attention'};s.returned={amount:'$2,412.18',retry_date:'Oct 8',date:'Oct 5'};s.needed_from_you=[clone(NEEDS.nsf)];s.display.today='Oct 5, 2026';s.display.today_iso='2026-10-05';s.recent.unshift({event:'ach.return.received',copy_key:'payment.returned',title:'Payment returned · $2,412.18',date:'Oct 5'});}
  if(id==='shortage'){s.shortage={status:'pending',amount:'$1,200.00',installment:'$100.00',new_payment:'$2,512.18',effective:'Nov 1',notice_date:'Oct 15',analysis_id:'DEMO-ESCROW-01'};s.needed_from_you=[clone(NEEDS.shortage)];s.status.one_liner='Next payment $2,412.18 due Oct 1 · review your escrow shortage';s.recent.unshift({event:'escrow.statement.sent',copy_key:'escrow.statement',title:'Your annual escrow statement is ready',date:'Sep 15'});}
  if(id==='insurance'){s.loan.insurance.hazard.status='evidence_needed';s.fpi={first_notice:'Aug 1',reminder:'Aug 31',placed:'Sep 15',premium:'$840.00',refund:'$840.00'};s.needed_from_you=[clone(NEEDS.insurance)];s.status.one_liner='Next payment $2,412.18 due Oct 1 · send your policy';s.recent.unshift({event:'fpi.first_notice.sent',copy_key:'insurance.fpi.first_notice',title:'Insurance notice sent',date:'Aug 1'});}
  if(id==='behind'){s.status={badge:'Behind',state_source:'loan.delinquency.day_reached',one_liner:'You’ve missed payments · help is available'};s.numbers.days_past_due=61;s.display.days_past_due='61';s.loan.autodraft.status='paused';s.loan.autodraft.next_draft_label=null;s.people=[clone(TEAM)];s.needed_from_you=[clone(NEEDS.behind)];s.display.today='Oct 1, 2026';s.display.today_iso='2026-10-01';}
  if(id==='plan'){s.status={badge:'On a plan',state_source:'workout_plan.activated',one_liner:'Trial payment 2 of 3 · $1,800.00 due Oct 1'};s.plan={stage:'2 of 3',amount:'$1,800.00',status:'active'};s.numbers.next_payment={amount_cents:'180000',due_on:'2026-10-01',pi_cents:'122888',escrow_cents:'57112'};s.display.next_payment='$1,800.00';s.display.pi='$1,228.88';s.loan.autodraft.status='paused';s.loan.autodraft.next_draft_label=null;s.people=[clone(TEAM)];s.recent.unshift({event:'workout_plan.activated',copy_key:'hardship.tpp.pay',title:'Trial payment plan started',date:'Sep 1'});}

window.createMyLoan=function({sheet,close,icon,refresh}){
  let loanState=fixture('current');
    const $=s=>document.querySelector(s);
  const field=n=>$('#sheet-body').querySelector(`[name="${n}"]`);
  const value=n=>field(n)?.value?.trim()||'';
  const checked=n=>!!field(n)?.checked;
  const kv=(k,v)=>`<div class="loan-kv"><span>${escape(k)}</span><strong>${escape(v)}</strong></div>`;
  const b=(label,action,command='',style='secondary',extra='')=>`<button class="${style==='link'?'loan-link':style==='choice'?'loan-choice':'loan-button '+style}" data-loan-action="${action}" ${command?`data-command="${command}"`:'data-loan-ui="true"'} ${extra}>${label}</button>`;
  const input=(label,name,v='',attrs='')=>`<label class="loan-field"><span>${label}</span><input name="${name}" value="${escape(v)}" ${attrs}></label>`;
  const select=(label,name,options,current)=>`<label class="loan-field"><span>${label}</span><select name="${name}">${options.map(([id,label])=>`<option value="${id}" ${id===current?'selected':''}>${escape(label)}</option>`).join('')}</select></label>`;
  const checkbox=(label,name)=>`<label class="loan-check"><input type="checkbox" name="${name}"><span>${label}</span></label>`;
  const card=(kind,key,content)=>`<div data-card-kind="${kind}" data-copy-key="${key}">${content}</div>`;
  const error=()=>'<div class="loan-error" role="alert" aria-live="polite"></div>';
  const show=(title,kind,key,html)=>sheet(title,`<div class="loan-sheet" data-card-kind="${kind}" data-copy-key="${key}">${html}${error()}</div>`);
  const fail=msg=>{const el=$('#sheet-body').querySelector('.loan-error');if(el){el.textContent=msg;el.scrollIntoView({block:'nearest'});}};
  function remember(){loanState.ui.open=[...document.querySelectorAll('.my-loan details[data-loan-section][open]')].map(x=>x.dataset.loanSection);}
  function redraw(){remember();refresh();}
  function commit(command,args={}){if(loanState.read_only)throw new Error('Read-only loan');if(!COMMANDS.has(command))throw new Error('Unknown servicing command');const entry={name:command,args:clone(args)};loanState.lastCommand=entry;loanState.commandHistory.push(entry);}
  function event(type,key,title,date=loanState.display.today,allocation=null){loanState.events.push({type,copy_key:key});loanState.recent.unshift({event:type,copy_key:key,title,date,...(allocation?{allocation}:{} )});loanState.recent=loanState.recent.slice(0,6);}
  function removeNeed(id){loanState.needed_from_you=loanState.needed_from_you.filter(n=>n.id!==id);}
  function result(title,key,body='',kind='StatusCard'){loanState.ui.result={title,key};redraw();show(title,kind,key,`<span class="loan-success-icon">${icon('check')}</span>${body}${b('Done','done')}`);}
  function guard(command,args,transition,before=null){
    if(loanState.read_only)return;
    if(FRESH_L1.has(command)){loanState.ui.pending={command,args,transition,before};show('Verify it’s you','ConfirmCard','auth.fresh_code',`<p>Enter the 6-digit code.</p><p class="loan-small">Demo code sent to a•••@example.com. Any 6 digits work.</p>${input('Verification code','loanCode','','type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"')}${b('Verify & continue','verify',command,'')}`);}
    else{if(before)before();commit(command,args);transition();}
  }
  function accordion(id,title,subtitle,body){return `<details class="loan-accordion" data-loan-section="${id}" ${loanState.ui.open.includes(id)?'open':''}><summary><span>${title}<span class="loan-subtitle">${subtitle}</span></span></summary><div class="loan-accordion-body">${body}</div></details>`;}
  function autopayLabel(){return ({active:'On',none:'Off',revoked:'Off',paused:'Paused',suspended_returns:'Suspended',terminated:'Ended'})[loanState.loan.autodraft.status]||'Off';}
  function primary(){const s=loanState;if(s.read_only)return null;if(s.loan.autodraft.status==='suspended_returns')return ['Fix autopay','suspended','autodraft.change'];if(s.shortage?.status==='pending')return ['Review escrow','shortage','escrow.electShortage'];if(s.loan.insurance.hazard.status==='evidence_needed')return ['Send policy','insurance','insurance.submitEvidence'];if(s.offer?.status==='offered')return ['Review offer','offer','offer.respond'];if(s.status.badge==='Behind'&&!s.hardship_requested)return ['I need help','hardship','lossmit.requestAssistance'];if(s.plan)return s.plan.status==='paid'?null:['Pay plan amount','planPay','payment.makeOneTime'];if(['Payment due','Past due'].includes(s.status.badge))return ['Pay now','pay','payment.makeOneTime'];if(s.status.badge==='Current'&&s.loan.autodraft.status==='active')return ['Extra principal','extra','payment.extraPrincipal'];if(!s.payment_scheduled)return ['Pay','pay','payment.makeOneTime'];return null;}
  function view(){
    const s=loanState,d=s.display,a=s.loan.autodraft,cta=primary();
    const needs=s.needed_from_you.length?`<h2>Needed from you</h2>${s.needed_from_you.map(n=>b(`${escape(n.label)}${icon('arrow')}`,n.action,n.command,'choice')).join('')}`:'<p>Nothing needed this month.</p>';
    const autopay=kv('Status',autopayLabel())+kv('Account',`Checking ····${a.account_last4}`)+kv('Draft day',a.draft_day_label)+(a.next_draft_label?kv('Next draft',a.next_draft_label):'')+(s.read_only?'':a.status==='active'?b('Change','autopayChange','autodraft.change')+b('Pause','autopayPause','autodraft.pause','link')+'<br>'+b('Revoke','autopayRevoke','autodraft.revoke','link'):a.status==='suspended_returns'?b('Fix autopay','suspended','autodraft.change'):b('Enroll','enroll','autodraft.enroll'));
    const escrow=kv('Escrow balance',d.escrow_balance)+s.loan.escrow_lines.map(l=>`<div class="loan-escrow-item"><strong>${l.label}</strong>${l.payee?escape(l.payee):''}<small>${l.next_label}</small></div>`).join('')+(s.shortage?shortageSummary():'')+`<div class="loan-mini-history">${s.escrow_history.map(h=>card('StatusCard','disbursement.issued',`<p>We paid ${escape(h.payee)}<br>${h.amount} · ${h.date}</p>`)).join('')}</div>`+(s.read_only?'':b('Ask to waive escrow','waiver','escrow.requestWaiver','link'));
    const insurance=s.fpi?fpiNotices():kv('Coverage','Verified')+kv('Renews',s.loan.insurance.hazard.renew_label)+kv('Flood insurance','Not required');

function chatAnswer(q){

  if(/plaid|bank|income|employment|connect/i.test(q))return{text:'A bank connection can provide assets and income signals. We’ll ask for payroll or documents if more is needed.',follow:'singleSource',label:'Connection details'};

  return{text:'I can help with your application, payments, or refinancing.',suggestions:true};
}

const DECLARATIONS=[
 {id:'extraDebt',label:'I have debts or support payments not listed.',question:'Do you have other credit obligations, alimony, child support, or separate maintenance payments not included in this application?'},
 {id:'seller',purchase:true,label:'I have a family or business tie to the seller.',question:'Do you have a family relationship or business affiliation with the seller of this property?'},
 {id:'borrowed',label:'I’m borrowing other, undisclosed money for closing.',question:'Are you borrowing money for this transaction, such as for the down payment or closing costs, or obtaining money from another party, that is not disclosed on this application?'},
 {id:'otherMortgage',label:'I’m applying for another mortgage before closing.',question:'Have you or will you be applying for a mortgage loan on another property before this loan closes that is not disclosed on this application?'},
 {id:'otherCredit',label:'I’m applying for other, undisclosed credit before closing.',question:'Have you or will you be applying for new credit, such as an installment loan, credit card, or line of credit, before closing that is not disclosed on this application?'},
 {id:'pace',label:'This home has a priority lien, such as PACE.',question:'Will this property be subject to a lien that could take priority over the first mortgage lien, such as a clean energy lien paid through your property taxes?'},
 {id:'cosigned',label:'I co-sign or guarantee an undisclosed debt.',question:'Are you a co-signer or guarantor on any debt or loan that is not disclosed on this application?'},
 {id:'judgment',label:'I have outstanding judgments.',question:'Are there any outstanding judgments against you?'},
 {id:'federal',label:'I’m delinquent or in default on federal debt.',question:'Are you currently delinquent or in default on a federal debt?'},
 {id:'lawsuit',label:'I’m in a lawsuit with potential financial liability.',question:'Are you a party to a lawsuit in which you potentially have personal financial liability?'},
 {id:'deed',label:'Deed-in-lieu of foreclosure in the past 7 years.',question:'Have you conveyed title to a property in lieu of foreclosure in the past seven years?'},
 {id:'shortSale',label:'Short sale or pre-foreclosure sale in the past 7 years.',question:'Within the past seven years, have you completed a pre-foreclosure sale or short sale in which the lender agreed to accept less than the full mortgage balance?'},
 {id:'foreclosure',label:'Foreclosure in the past 7 years.',question:'Have you had property foreclosed upon in the last seven years?'},
 {id:'bankruptcy',label:'Bankruptcy in the past 7 years.',question:'Have you declared bankruptcy in the past seven years?'}
];
const applicableDeclarations=()=>DECLARATIONS.filter(d=>!d.purchase||S.intent==='purchase');
function declarationList(){return `<div class="decl-list">${applicableDeclarations().map(d=>check(esc(d.label),`decl_${d.id}`,S.declarations?.[d.id]===true)).join('')}</div>`}
function declarationSummary(){const groups=[['Unlisted finances','Debts, support payments, guarantees, or undisclosed money for closing.'],['New borrowing','Other mortgage or credit applications before closing.'],['Property issues',S.intent==='purchase'?'Family or business ties to the seller; priority liens, including PACE.':'Priority liens, including PACE.'],['Legal or federal debt issues','Judgments, federal debt default, or lawsuits with financial liability.'],['Credit events','Bankruptcy, foreclosure, deed-in-lieu, or short sale in the past 7 years.']];return `<ul class="declaration-summary">${groups.map(([title,description])=>`<li><strong>${title}</strong><span>${description}</span></li>`).join('')}</ul>`}
const ethnicities=[['hispanic','Hispanic or Latino'],['notHispanic','Not Hispanic or Latino']];
const races=[['native','American Indian or Alaska Native'],['asian','Asian'],['black','Black or African American'],['pacific','Native Hawaiian or Other Pacific Islander'],['white','White']];
const ethnicSubs=[['mexican','Mexican'],['puertoRican','Puerto Rican'],['cuban','Cuban'],['otherHispanic','Other Hispanic or Latino']];
const asianSubs=[['asianIndian','Asian Indian'],['chinese','Chinese'],['filipino','Filipino'],['japanese','Japanese'],['korean','Korean'],['vietnamese','Vietnamese'],['otherAsian','Other Asian']];
const pacificSubs=[['nativeHawaiian','Native Hawaiian'],['guamanian','Guamanian or Chamorro'],['samoan','Samoan'],['otherPacific','Other Pacific Islander']];
function demoChecks(group,list){return list.map(([k,t])=>check(t,`${group}_${k}`,S.demographics[group].includes(k))).join('')}
function demographicForm(){return `<h3>Ethnicity</h3>${demoChecks('ethnicity',ethnicities)}${details('Ethnicity details',`<div class="sub-options">${demoChecks('ethnicity',ethnicSubs)}${input('Other origin','otherEthnicity',S.demographics.otherEthnicity)}</div>`)}${demoChecks('ethnicity',[['decline','I do not wish to provide']])}<h3>Race</h3>${demoChecks('race',races)}${details('Race details',`<div class="sub-options">${input('Tribe','tribe',S.demographics.tribe)}${demoChecks('race',asianSubs)}${input('Other Asian origin','otherAsian',S.demographics.otherAsian)}${demoChecks('race',pacificSubs)}${input('Other Pacific Islander origin','otherPacific',S.demographics.otherPacific)}</div>`)}${demoChecks('race',[['decline','I do not wish to provide']])}<h3>Sex</h3>${demoChecks('sex',[['female','Female'],['male','Male'],['decline','I do not wish to provide']])}`}
function demoSummary(){if(!S.demographicRecorded)return'Not yet reviewed';return ['ethnicity','race','sex'].every(k=>S.demographics[k].includes('decline'))?'You chose not to provide':['ethnicity','race','sex'].every(k=>!S.demographics[k].length)?'Not provided':'Your responses recorded'}
function financialReady(){return S.bank!=='none'}
function toDetails(){if(S.credit==='pending')completeCredit();if(S.credit==='frozen'){go('frozen');return}if(S.credit!=='ready'){go('borrower');return}if(!financialReady()){toast('Connect, add documents, or enter amounts.');return}if(S.scenario==='dispute'&&!S.issueResolved){actions.resolveCredit();return}go('details')}
function runSubmission(){timer=setTimeout(()=>{if(S.screen!=='submitting')return;S.step++;if(S.step>=3){finishSubmission();return}render();runSubmission()},1000)}
function finishSubmission(){if(S.screen!=='submitting'||!S.submission)return;clearTimeout(timer);S.incomeValidation=S.bank==='connected'&&S.payrollSignal&&S.incomeType==='w2'?'simulated':'pending';log('Simulated DU findings returned.');go('result',true)}
function bankDialog(){sheet('Plaid · demo',`<p>Select your accounts.</p><div class="card"><h3>Northstar Bank</h3>${check('Checking · 4821','account_checking',S.accounts.includes('checking'),'$22,000 · pay deposits')}${check('Savings · 6904','account_savings',S.accounts.includes('savings'),'$78,000')}</div>${check('Share balances and 12 months of transactions.','bankConsent')}<p class="fine">For assets and eligible income / employment validation. No real accounts are connected.</p>${btn('Connect selected accounts','grantBank')}${error()}`)}
function invite(){if(S.screen==='borrower'){const v=values();for(const k of ['name','email','address'])if(v[k]?.trim())S[k]=v[k].trim()}sheet('Invite a co-borrower',`<div class="card">${row('Sample applicant','Jordan Lee')}${row('Status',S.partnerReady?'Profile complete':S.invited?'Invite prepared':'Not invited')}</div><p>They complete their own profile and permissions.</p>${btn(S.partnerReady?'Done':S.invited?'Simulate Jordan completing':'Prepare sample invite',S.partnerReady?'close':S.invited?'completePartner':'sendInvite')}<p class="fine">No invitation is sent.</p>`)}
function collectQuestions(root=$('#main')){const answers={};applicableDeclarations().forEach(d=>{answers[d.id]=checked(`decl_${d.id}`,root)});return answers}
function recordDeclarations(answers){S.declarations=answers;S.declarationsConfirmed=!Object.values(answers).some(Boolean);S.reviewConfirmed=false;log('Borrower explicitly confirmed each applicable declaration.');if(answers.extraDebt||answers.borrowed||answers.bankruptcy||Object.values(answers).some(Boolean)){sheet('A little more detail',`${answers.extraDebt||answers.borrowed?`${input('Monthly payment for unlisted obligations','extraDebt',S.extraDebt,'number','$','min="0"')}${input('Debt / obligation type','extraDebtType',S.extraDebtType)}`:''}${answers.bankruptcy?select('Bankruptcy chapter','bankruptcyChapter',[['7','Chapter 7'],['11','Chapter 11'],['12','Chapter 12'],['13','Chapter 13']],S.bankruptcyChapter||'7'):''}${input('Brief explanation','declarationContext',S.declarationContext)}${btn('Continue','saveDeclarationContext')}${error()}`)}else{go('demographics')}}
function readDemographics(){const d={...S.demographics};for(const g of ['ethnicity','race','sex'])d[g]=all(`input[name^="${g}_"]`,$('#main')).filter(e=>e.checked).map(e=>e.name.slice(g.length+1));const v=values();for(const k of ['otherEthnicity','tribe','otherAsian','otherPacific'])d[k]=v[k]||'';return d}
function submissionErrors(){const errors=[];if(S.credit!=='ready'||!S.creditConsent||S.creditKey!==creditKey())errors.push('Complete the credit check.');if(!financialReady())errors.push('Add income and asset information.');if(!S.detailsConfirmed)errors.push('Confirm your details.');if(!S.declarationsConfirmed)errors.push('Confirm your declarations.');if(!S.demographicRecorded)errors.push('Review the demographic section; answers are optional.');if(S.joint==='yes'&&!S.partnerReady)errors.push('Your co-borrower needs to finish.');if(principal()<=0)errors.push('Check the requested loan amount.');return errors}
function buildCasefile(){const e=estimate();return{simulation:true,route:'standard_du',purpose:S.intent,refinanceType:S.intent==='refinance'?(S.goal==='cash'?'cash_out':'limited_cash_out'):null,borrower:{name:S.name,email:S.email,phone:S.phone,dob:S.dob,ssn:'DEMO_ID_NOT_TRANSMITTABLE',currentAddress:S.address,monthsAtAddress:S.residenceMonths,previousAddress:S.previousAddress||null,citizenship:S.citizenship,maritalStatus:S.marital,dependents:S.dependents,dependentAges:S.dependentAges,housing:S.housing,currentHousingPayment:S.rent,employment:{type:S.incomeType,employer:S.employer,title:S.jobTitle,years:S.employmentYears,priorEmployer:S.priorEmployer,annualIncome:S.income,additionalIncome:S.extraIncome,additionalIncomeType:S.extraIncomeType},declarations:{...S.declarations},declarationContext:S.declarationContext,bankruptcyChapter:S.bankruptcyChapter||null,demographics:structuredClone(S.demographics),demographicCollection:{method:'internet_no_video',presented:S.demographicPresented,recorded:S.demographicRecorded}},coBorrower:S.joint==='yes'?{name:'Jordan Lee',status:S.partnerReady?'complete':'pending',separateConsents:S.partnerReady,annualIncome:S.partnerReady?54000:null}:null,property:{address:S.shopping?'TBD':S.property,searchLocation:S.location,occupancy:S.occupancy,type:S.propertyType,units:S.units,value:S.intent==='purchase'?S.price:S.homeValue,price:S.intent==='purchase'?S.price:null,ownedInPast3Years:S.intent==='refinance'||S.ownedBefore,priorOwnershipPropertyType:S.ownedPropertyType,priorOwnershipTitleType:S.ownedTitleType,otherRealEstate:S.otherProperties==='yes'?{address:S.otherPropertyAddress,value:S.otherPropertyValue,mortgage:S.otherPropertyBalance,housingPayment:S.otherPropertyPayment}:null},loan:{amount:e.loan,rate:S.rate,termMonths:e.years*12,amortization:'fixed',lien:'first',proposedHousingPayment:e.total,taxes:S.tax,insurance:S.insurance,hoa:S.hoa,mortgageInsurance:e.mi,downPayment:S.intent==='purchase'?S.down:0,fundSource:S.fundSource,giftAmount:S.giftAmount,cashOut:S.goal==='cash'?S.cashOut:0,subjectPayoffs:S.intent==='refinance'?S.balance+S.otherLien:0},assets:{available:S.cash,source:S.bank,selectedAccounts:[...S.accounts],reportReference:S.reportId||null,historyMonths:S.bank==='connected'?S.reportMonths:null},credit:{reportReference:'DEMO_CREDIT_001',type:'tri_merge_hard',authorized:S.creditConsent,autoPopulateLiabilities:true},liabilities:[{type:'auto',balance:12800,monthlyPayment:320,included:true},{type:'revolving',balance:3200,monthlyPayment:110,included:true},...(S.intent==='refinance'?[{type:'subject_mortgage',balance:S.balance,monthlyPayment:pmt(S.balance,S.currentRate,S.yearsLeft*12),payoffAtClose:true,includedInProposedDTI:false}]:[]),...(S.extraDebt>0?[{type:S.extraDebtType||'other',monthlyPayment:S.extraDebt,included:true}]:[])],permissions:{review:S.reviewConfirmed,delivery:S.paper?'paper':'electronic'},validation:{incomeAndEmployment:'Pending DU findings',assetReportAttached:!!S.reportId}}}
function captureDetails(){if(S.screen!=='details')return;const v=values();for(const k of Object.keys(v)){if(!(k in S))continue;if(typeof S[k]==='number'&&v[k]!==''&&Number.isFinite(+v[k]))S[k]=+v[k];else if(typeof S[k]==='string')S[k]=v[k];else if(k==='ownedBefore')S[k]=v[k]==='true'}S.detailsConfirmed=false;S.reviewConfirmed=false}
const actions={
chatSend:()=>sendChat($('#prompt').value),
chatPrompt:b=>sendChat(b.dataset.prompt),
chatFollow:b=>{const follow=b.dataset.follow;if(['application','myLoan','account'].includes(follow))actions.tab({dataset:{tab:follow}});else if(['schedule','creditDetails','singleSource','demographicDetails','liabilities'].includes(follow))actions[follow]()},
chatAttach:()=>sheet('Add a sample document',`<div class="stack">${choice('Mortgage statement','','file','chatDocument','data-document="mortgage"')}${choice('Purchase contract','','file','chatDocument','data-document="purchase"')}${choice('Bank & income documents','','bank','chatDocument','data-document="bank"')}</div>`),
chatDocument:b=>{const docs={mortgage:'sample_mortgage_statement.pdf',purchase:'sample_purchase_contract.pdf',bank:'sample_bank_and_income.pdf'};const name=docs[b.dataset.document];if(!name||activeTab!=='chat')return;close();chatHistory.push({role:'user',text:name,attachment:true},{role:'assistant',text:'Added to this chat.',follow:'application',label:'Open application'});renderChat();$('#chat-thread').lastElementChild?.scrollIntoView({block:'end',behavior:'smooth'})},

tab:b=>{const next=b.dataset.tab;if(!navItems.some(n=>n[0]===next))return;close();activeTab=next;renderNavigation();window.scrollTo({top:0,behavior:'instant'});$(next==='application'?'#main':next==='chat'?'#chat-panel':'#panel').focus({preventScroll:true});if(next==='chat')$('#chat-thread').lastElementChild?.scrollIntoView({block:'end'})},
fileScope:b=>{if(!['reports','application'].includes(b.dataset.scope))return;fileScope=b.dataset.scope;renderNavigation()},
taskStep:b=>{const target=b.dataset.screen;if(S.visited.includes(target))go(target);else{toast(S.screen==='start'?'Choose buy or refinance to start.':'Continue your current step first.');activeTab='application';renderNavigation()}},
home:()=>S.screen==='start'?toast('Choose buying or refinancing.'):actions.restart(),
back:()=>{if(S.screen==='submitting'){toast('The demo check is running.');return}go(S.history.pop()||'start',true)},close,

shopping:b=>{const v=values();if(v.property)S.property=v.property;if(v.location)S.location=v.location;if(+v.price>0)S.price=+v.price;if(+v.down>=0)S.down=+v.down;S.shopping=b.dataset.value==='true';render()},
