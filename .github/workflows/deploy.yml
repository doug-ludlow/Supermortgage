# Deploys Supermortgage to Google Cloud.
#
# Prerequisite (once per project): infra/bootstrap.sh, which prints the five
# repository VARIABLES this workflow reads (vars.GCP_PROJECT_ID, vars.GCP_REGION,
# vars.GCP_WIF_PROVIDER, vars.GCP_DEPLOYER_SA, vars.TF_STATE_BUCKET).
# No GitHub secrets are needed: authentication is Workload Identity Federation.
#
# Order: preflight -> terraform -> build (api + borrower, in parallel) -> migrate -> deploy.
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy (matches the Terraform state prefix)
        required: true
        default: nonprod
        type: string
      seed_demo:
        description: After deploying, board the 100-loan demo transfer batch (idempotent)
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - claude/mortgage-subservicer-builder-y9nr7e
    # A push that changes only what the image does not carry ships nothing new: no build, no deploy, no walk.
    # The image does carry spec/registry (the timer registry the tools run on), spec/sections/*/*.md (the agent
    # turn hands the model the current step's rules — src/runtime/borrower/agent/rules.ts) and
    # docs/ux/12-message-copy-library.md (src/runtime/borrower/channels.ts renders SMS, voice and talk copy
    # from it) — see Dockerfile and .dockerignore — so those re-include below and deploy. Negations belong in
    # `paths` (GitHub evaluates them in order; paths-ignore takes none). workflow_dispatch always deploys.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "spec/sections/**/*.md"
      - "docs/ux/12-message-copy-library.md"

permissions:
  contents: read
  id-token: write # required to mint the OIDC token Workload Identity Federation exchanges

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'nonprod' }}
  TF_VERSION: 1.9.8

# One deploy per environment at a time; a newer run waits for the older one.
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'nonprod' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check the bootstrap variables are set
        id: check
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          missing=0
          for v in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOYER_SA TF_STATE_BUCKET; do
            if [ -z "${!v}" ]; then
              echo "::warning::Repository variable $v is not set."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::warning::Deploy skipped: run infra/bootstrap.sh in Google Cloud Shell and set the variables it prints at https://github.com/${GITHUB_REPOSITORY}/settings/variables/actions (see docs/DEPLOY.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Deploying to project ${GCP_PROJECT_ID} (${GCP_REGION}), environment ${ENVIRONMENT}."

  terraform:
    name: terraform
    needs: preflight
    # Until the bootstrap variables exist the pipeline stops here, quietly, instead of failing every push.
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    outputs:
      artifact_repo: ${{ steps.out.outputs.artifact_repo }}
      lb_ip: ${{ steps.out.outputs.lb_ip }}
      sql_connection_name: ${{ steps.out.outputs.sql_connection_name }}
      api_hostname: ${{ steps.out.outputs.api_hostname }}
      console_hostname: ${{ steps.out.outputs.console_hostname }}
      borrower_url: ${{ steps.out.outputs.borrower_url }}
      dns_records: ${{ steps.out.outputs.dns_records }}
      api_token_secret: ${{ steps.out.outputs.api_token_secret }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # the wrapper breaks `terraform output -raw`

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=supermortgage/${ENVIRONMENT}"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: terraform validate

      - name: terraform apply
        run: |
          terraform apply -auto-approve -input=false \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var "region=${{ vars.GCP_REGION }}" \
            -var "environment=${ENVIRONMENT}"

      - name: Collect outputs
        id: out
        run: |
          {
            echo "artifact_repo=$(terraform output -raw artifact_registry_repo)"
            echo "lb_ip=$(terraform output -raw load_balancer_ip)"
            echo "sql_connection_name=$(terraform output -raw sql_connection_name)"
            echo "api_hostname=$(terraform output -raw api_url | sed 's#^https://##')"
            echo "console_hostname=$(terraform output -raw console_url | sed 's#^https://##')"
            echo "borrower_url=$(terraform output -raw borrower_url)"
            echo "dns_records=$(terraform output -json godaddy_dns_records | jq -c .)"
            echo "api_token_secret=$(terraform output -raw api_token_secret)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build image
    needs: terraform
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Compute image tags
        id: tags
        env:
          REPO: ${{ needs.terraform.outputs.artifact_repo }}
        run: |
          # Branch slug: lowercase, anything outside [a-z0-9._-] becomes '-', max 63 chars.
          slug="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//' | cut -c1-63)"
          {
            echo "image=${REPO}/api:${GITHUB_SHA}"
            echo "branch_image=${REPO}/api:${slug}"
          } >> "$GITHUB_OUTPUT"

      - name: docker build
        run: |
          docker build \
            -t "${{ steps.tags.outputs.image }}" \
            -t "${{ steps.tags.outputs.branch_image }}" \
            .

      - name: docker push
        run: |
          docker push "${{ steps.tags.outputs.image }}"
          docker push "${{ steps.tags.outputs.branch_image }}"

  build-borrower:
    name: build borrower image
    needs: terraform
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Compute image tags
        id: tags
        env:
          REPO: ${{ needs.terraform.outputs.artifact_repo }}
        run: |
          slug="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//' | cut -c1-63)"
          {
            echo "image=${REPO}/borrower:${GITHUB_SHA}"
            echo "branch_image=${REPO}/borrower:${slug}"
          } >> "$GITHUB_OUTPUT"

      # apps/borrower: Next.js standalone build (Dockerfile.borrower at the repo root).
      - name: docker build (borrower)
        run: |
          docker build \
            -f Dockerfile.borrower \
            --build-arg "NEXT_PUBLIC_ENVIRONMENT=${ENVIRONMENT}" \
            --build-arg "NEXT_PUBLIC_PARTNER_LEGAL_NAME=${{ vars.PARTNER_LEGAL_NAME || 'Partner Bank' }}" \
            --build-arg "NEXT_PUBLIC_PARTNER_NMLSR_ID=${{ vars.PARTNER_NMLSR_ID || '123456' }}" \
            -t "${{ steps.tags.outputs.image }}" \
            -t "${{ steps.tags.outputs.branch_image }}" \
            .

      - name: docker push (borrower)
        run: |
          docker push "${{ steps.tags.outputs.image }}"
          docker push "${{ steps.tags.outputs.branch_image }}"

  migrate:
    name: migrate database
    needs: [terraform, build]
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Point the migrate job at the new image
        run: |
          gcloud run jobs update supermortgage-migrate \
            --image "${{ needs.build.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --quiet

      - name: Run migrations (db/migrate.sh inside the container)
        run: |
          gcloud run jobs execute supermortgage-migrate \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --wait

  deploy:
    name: deploy
    needs: [terraform, build, build-borrower, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # db/migrations names the migration head the manifest records (35.12 rule 1)

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Point the sweep job at the new image
        run: |
          gcloud run jobs update supermortgage-sweep \
            --image "${{ needs.build.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --quiet

      - name: Point the seed-demo job at the new image
        run: |
          gcloud run jobs update supermortgage-seed-demo \
            --image "${{ needs.build.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --quiet

      - name: Deploy the API service
        run: |
          gcloud run deploy supermortgage-api \
            --image "${{ needs.build.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --quiet

      - name: Deploy the borrower app
        run: |
          gcloud run deploy supermortgage-borrower \
            --image "${{ needs.build-borrower.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --quiet

      - name: Service URL
        run: |
          url="$(gcloud run services describe supermortgage-api \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format 'value(status.url)')"
          echo "Cloud Run URL (ingress is load-balancer only, so this is not reachable directly): ${url}"

      # 35.12 rule 1: the deploy records what it deployed — an environment manifest of facts (names, flags, version dates;
      # never a secret's payload) posted to /v1/posture/manifests under a 35.7 service principal (POSTURE_PRINCIPAL_TOKEN,
      # issued once with principals.issue and stored as a repository secret; the shared API token opens nothing here).
      # posture.record hashes the manifest, runs the posture check (PST-01 … PST-17) and opens drift findings. Without the
      # secret the step says so and skips; a failure never fails the deploy. Facts this runner cannot read stay absent, so
      # their controls answer `unverifiable` rather than a guess ([UNVERIFIED fields]: Cloud Armor, the deployer's IAM
      # roles, org policies, the audit sink, the log sample).
      - name: Record the environment manifest (35.12 posture.record)
        continue-on-error: true
        env:
          POSTURE_PRINCIPAL_TOKEN: ${{ secrets.POSTURE_PRINCIPAL_TOKEN }}
          API_HOSTNAME: ${{ needs.terraform.outputs.api_hostname }}
          LB_IP: ${{ needs.terraform.outputs.lb_ip }}
          IMAGE: ${{ needs.build.outputs.image }}
          SQL: ${{ needs.terraform.outputs.sql_connection_name }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          if [ -z "${POSTURE_PRINCIPAL_TOKEN}" ]; then
            echo "::notice::No POSTURE_PRINCIPAL_TOKEN secret: the environment manifest was not recorded (issue a 35.7 service principal with principals.issue and store its token as the repository secret)."
            exit 0
          fi
          echo "::add-mask::${POSTURE_PRINCIPAL_TOKEN}"
          instance="${SQL##*:}"
          sql="$(gcloud sql instances describe "${instance}" --project "${PROJECT}" --format json)"
          api="$(gcloud run services describe supermortgage-api --region "${REGION}" --project "${PROJECT}" --format json)"
          digest="$(gcloud artifacts docker images describe "${IMAGE}" --format 'value(image_summary.digest)' 2>/dev/null || echo "${IMAGE##*:}")"
          migration_head="$(ls db/migrations | sort | tail -n 1 | cut -c1-4)"   # the checkout's head: the image this job deployed was built from this commit
          # the secret names and their latest version's creation instant — never `versions access`
          secrets='[]'
          for name in $(gcloud secrets list --project "${PROJECT}" --filter 'name~supermortgage-' --format 'value(name)'); do
            created="$(gcloud secrets versions describe latest --secret "${name}" --project "${PROJECT}" --format 'value(createTime)' 2>/dev/null || true)"
            secrets="$(echo "${secrets}" | jq -c --arg n "${name}" --arg c "${created}" '. + [{name: $n, version_created_at: ($c | select(. != "")), placeholder: ($c == "")}]')"
          done
          manifest="$(jq -cn \
            --arg environment "${ENVIRONMENT}" --arg project "${PROJECT}" --arg region "${REGION}" --arg digest "${digest}" \
            --arg migration_head "${migration_head:-unknown}" --arg run_id "${GITHUB_RUN_ID}" \
            --argjson sql "${sql}" --argjson api "${api}" --argjson secrets "${secrets}" '
            {
              environment: $environment, project_id: $project, region: $region, image_digest: $digest, migration_head: $migration_head, deploy_run_id: $run_id,
              terraform: {
                sql: {
                  ipv4_enabled: ($sql.settings.ipConfiguration.ipv4Enabled // false),
                  private_service_access: (($sql.settings.ipConfiguration.privateNetwork // "") != ""),
                  availability_type: ($sql.settings.availabilityType // "UNKNOWN"),
                  pitr: ($sql.settings.backupConfiguration.pointInTimeRecoveryEnabled // false),
                  log_retention_days: ($sql.settings.backupConfiguration.transactionLogRetentionDays // 0),
                  retained_backups: ($sql.settings.backupConfiguration.backupRetentionSettings.retainedBackups // 0),
                  cmek_key: ($sql.diskEncryptionConfiguration.kmsKeyName // null)
                },
                run: {
                  env_names: [ ($api.spec.template.spec.containers[0].env // [])[] | .name ],
                  ingress: ($api.metadata.annotations["run.googleapis.com/ingress"] // "all"),
                  vpc_egress: ($api.spec.template.metadata.annotations["run.googleapis.com/vpc-access-egress"] // "private-ranges-only")
                }
              },
              secrets: $secrets,
              runtime: {
                environment: $environment,
                integrations: (([ ($api.spec.template.spec.containers[0].env // [])[] | select(.name == "INTEGRATIONS") | .value ] | first) // "fake"),
                fake_reviewers: (([ ($api.spec.template.spec.containers[0].env // [])[] | select(.name == "FAKE_REVIEWERS") | .value ] | first)
                  // (if ((([ ($api.spec.template.spec.containers[0].env // [])[] | select(.name == "INTEGRATIONS") | .value ] | first) // "fake") == "fake" and $environment != "production") then "on" else "off" end)),
                env_names: [ ($api.spec.template.spec.containers[0].env // [])[] | .name ]
              }
            }')"
          # the demo clock's answer from the deployed service (35.12 PST-11): 403 outside nonprod
          demo_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --resolve "${API_HOSTNAME}:443:${LB_IP}" -X POST "https://${API_HOSTNAME}/v1/demo/clock" -H 'content-type: application/json' --data '{}' || true)"
          case "${demo_status}" in ''|*[!0-9]*) demo_status=0;; esac
          manifest="$(echo "${manifest}" | jq -c --argjson st "${demo_status}" '.runtime.demo_clock_status = $st')"
          out="$(curl --silent --show-error --write-out '\n%{http_code}' \
            --resolve "${API_HOSTNAME}:443:${LB_IP}" \
            -X POST "https://${API_HOSTNAME}/v1/posture/manifests" \
            -H "authorization: Bearer ${POSTURE_PRINCIPAL_TOKEN}" -H 'content-type: application/json' \
            --data "${manifest}")"
          code="$(echo "${out}" | tail -n1)"
          body="$(echo "${out}" | sed '$d')"
          echo "posture.record → ${code}"
          echo "${body}" | jq '{manifest_id: .output.manifest_id, env_hash: .output.env_hash, check: {run_id: .output.check.run_id, failed: .output.check.failed, unverifiable: .output.check.unverifiable, findings_opened: .output.check.findings_opened}}' 2>/dev/null || echo "${body}" | head -c 600
          test "${code}" = "200"

      # Ingress is restricted to the load balancer, so the only honest smoke
      # test is through it. --resolve pins the hostname to the LB IP so the
      # test works before DNS propagates; TLS is still fully verified, which is
      # why this step passes only once the GoDaddy A records exist AND the
      # Google-managed certificate has finished provisioning (up to ~60 minutes
      # after DNS). Until then it fails without failing the deploy.
      - name: Smoke test /healthz through the load balancer
        continue-on-error: true
        env:
          API_HOSTNAME: ${{ needs.terraform.outputs.api_hostname }}
          LB_IP: ${{ needs.terraform.outputs.lb_ip }}
        run: |
          echo "::notice::Smoke test passes only once the GoDaddy DNS records exist and the managed certificate has provisioned (up to 60 minutes after DNS)."
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 15 --retry-all-errors \
            --resolve "${API_HOSTNAME}:443:${LB_IP}" \
            "https://${API_HOSTNAME}/healthz"
          echo
          echo "healthz OK via ${LB_IP}"

      - name: Smoke test /app (borrower) through the load balancer
        continue-on-error: true
        env:
          API_HOSTNAME: ${{ needs.terraform.outputs.api_hostname }}
          LB_IP: ${{ needs.terraform.outputs.lb_ip }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 10 --retry-delay 15 --retry-all-errors \
            --resolve "${API_HOSTNAME}:443:${LB_IP}" \
            "https://${API_HOSTNAME}/app"
          echo "borrower app OK via ${LB_IP}"

      - name: Smoke test / (302 to /app) and /ops (console) through the load balancer
        continue-on-error: true
        env:
          API_HOSTNAME: ${{ needs.terraform.outputs.api_hostname }}
          LB_IP: ${{ needs.terraform.outputs.lb_ip }}
        run: |
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --retry 10 --retry-delay 15 --retry-all-errors \
            --resolve "${API_HOSTNAME}:443:${LB_IP}" \
            "https://${API_HOSTNAME}/")"
          test "${code}" = "302" || { echo "expected 302 from /, got ${code}"; exit 1; }
          # 32.17: /video → 302 /app/video (infra/terraform/lb.tf path rule beside the "/" one)
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --resolve "${API_HOSTNAME}:443:${LB_IP}" \
            "https://${API_HOSTNAME}/video")"
          test "${code}" = "302" || { echo "expected 302 from /video, got ${code}"; exit 1; }
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --resolve "${API_HOSTNAME}:443:${LB_IP}" \
            "https://${API_HOSTNAME}/ops")"
          # 34.1 rule 1: the door page is public by design (the staff sign in there); the console API without a session is 401 AUTH_REQUIRED (34.1-T4)
          test "${code}" = "200" || { echo "expected 200 from /ops (the sign-in page), got ${code}"; exit 1; }
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --resolve "${API_HOSTNAME}:443:${LB_IP}" \
            "https://${API_HOSTNAME}/ops/api/me")"
          test "${code}" = "401" || { echo "expected 401 from /ops/api/me without a session, got ${code}"; exit 1; }
          echo "/ redirects to /app; /video redirects to /app/video; /ops serves the sign-in page and /ops/api/me refuses without a session via ${LB_IP}"

      - name: Board the demo transfer batch (workflow_dispatch with seed_demo)
        if: github.event.inputs.seed_demo == 'true'
        run: |
          gcloud run jobs execute supermortgage-seed-demo \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --wait

      - name: Job summary (DNS records to enter at GoDaddy)
        env:
          DNS_RECORDS: ${{ needs.terraform.outputs.dns_records }}
          LB_IP: ${{ needs.terraform.outputs.lb_ip }}
          API_HOSTNAME: ${{ needs.terraform.outputs.api_hostname }}
          CONSOLE_HOSTNAME: ${{ needs.terraform.outputs.console_hostname }}
          BORROWER_URL: ${{ needs.terraform.outputs.borrower_url }}
          IMAGE: ${{ needs.build.outputs.image }}
          BORROWER_IMAGE: ${{ needs.build-borrower.outputs.image }}
          SQL: ${{ needs.terraform.outputs.sql_connection_name }}
        run: |
          {
            echo "## Supermortgage deployed (${ENVIRONMENT})"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Borrower image: \`${BORROWER_IMAGE}\`"
            echo "- Cloud SQL: \`${SQL}\`"
            echo "- Load balancer IP: \`${LB_IP}\`"
            echo
            echo "### DNS records to enter at GoDaddy (supermortgage.com -> DNS -> Add New Record)"
            echo
            echo "| Type | Name | Value | TTL |"
            echo "|---|---|---|---|"
            echo "${DNS_RECORDS}" | jq -r '.[] | "| \(.type) | \(.name) | \(.value) | \(.ttl) |"'
            echo
            echo "Once the record resolves, the managed certificate provisions (up to 60 minutes) and these answer:"
            echo
            echo "- https://${API_HOSTNAME}/healthz"
            echo "- https://${CONSOLE_HOSTNAME}/"
            echo "- ${BORROWER_URL} (borrower app)"
            echo
            echo "API token: \`gcloud secrets versions access latest --secret supermortgage-api-token --project ${{ vars.GCP_PROJECT_ID }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The demo walk (docs/ux/18; PLAN §4): after every deploy, a real browser drives
  # the Apply product on the deployed demo — fresh accounts through the door, the
  # nine screens to the DU moment — and checks the ten things a person must see
  # work (apps/borrower/tests/walk/demo-walk.mts). The screenshots and report.json
  # are the artifact "demo-walk" — the only claim of "working" the surface
  # accepts. A failed outcome fails this job, never the deploy that preceded it.
  # Outcomes 3–5 (the DU moment, the preapproval request, the cash-out refinance)
  # read the application's record through the ops API, so the job authenticates
  # to Google Cloud the way the deploy job does and reads the API token out of
  # Secret Manager into WALK_OPS_TOKEN (masked); without it those outcomes fail by
  # name, never pass. Outcome 9 needs the partner book a `seed_demo=true` dispatch
  # imports; an unseeded book fails, never passes.
  walk:
    name: demo walk (real browser, the Apply product)
    needs: [terraform, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Read the API token for outcomes 3–5 (the ops record of the DU moment)
        env:
          API_TOKEN_SECRET: ${{ needs.terraform.outputs.api_token_secret }}
        run: |
          token="$(gcloud secrets versions access latest --secret "${API_TOKEN_SECRET}" --project "${{ vars.GCP_PROJECT_ID }}")"
          echo "::add-mask::${token}"
          echo "WALK_OPS_TOKEN=${token}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/borrower/package-lock.json }
      - name: Install the borrower app's dependencies and Chromium
        working-directory: apps/borrower
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Walk the demo
        working-directory: apps/borrower
        env:
          DEMO_BASE: https://${{ needs.terraform.outputs.api_hostname }}
          WALK_OUT: walk-out
          # WALK_OPS_TOKEN rides in from $GITHUB_ENV (the step above)
        run: node --experimental-strip-types tests/walk/demo-walk.mts
      - name: Keep the screenshots and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-walk
          path: apps/borrower/walk-out
          if-no-files-found: warn
          retention-days: 14
      - name: Summary
        if: always()
        working-directory: apps/borrower
        run: |
          if [ -f walk-out/report.json ]; then
            { echo "## Demo walk"; echo; node -e 'const r=require("./walk-out/report.json"); console.log(`${r.passed} of ${r.checks.length} outcomes hold on ${r.base}`); console.log(); for (const c of r.checks) console.log(`- ${c.ok ? "ok" : "NOT ok"} ${c.n}. ${c.what}${c.detail ? " — " + c.detail.replace(/\n/g, " ") : ""}`)'; } >> "$GITHUB_STEP_SUMMARY"
          fi
