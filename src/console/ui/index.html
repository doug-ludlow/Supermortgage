<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supermortgage Ops Console</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1c2430;--muted:#66717f;--line:#e2e6ec;--accent:#1f5fbf;--accent-ink:#fff;--warn:#b7791f;--bad:#b42323;--good:#1f7a3a;--chip:#eef2f7;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121721;--panel:#1a2130;--ink:#e6eaf0;--muted:#98a2b3;--line:#2a3344;--accent:#6ea0ff;--accent-ink:#0b1220;--warn:#e0a94a;--bad:#ef6b6b;--good:#5bc47c;--chip:#242d3d}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
header h1{font-size:15px;margin:0;letter-spacing:.2px}header h1 span{color:var(--muted);font-weight:400}
.actor{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted)}
input,select,button,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);cursor:pointer}button.primary:disabled{opacity:.5;cursor:not-allowed}
button.ghost{cursor:pointer}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 53px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:12px 0}
nav a{display:flex;justify-content:space-between;padding:8px 18px;color:var(--ink);text-decoration:none}nav a.active{background:var(--chip);border-right:3px solid var(--accent)}
nav .count{color:var(--muted);font-variant-numeric:tabular-nums}nav h3{font-size:11px;text-transform:uppercase;color:var(--muted);margin:14px 18px 6px;letter-spacing:.6px}
main{padding:18px 22px;max-width:1300px}
h2{font-size:18px;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.tile .k{color:var(--muted);font-size:12px}.tile .v{font-size:26px;font-variant-numeric:tabular-nums;margin-top:4px}.tile .v.bad{color:var(--bad)}.tile .v.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600;background:var(--chip)}tr:last-child td{border-bottom:0}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--chip);font-size:12px;color:var(--muted)}.chip.sev-1,.chip.bad{color:var(--bad);border:1px solid var(--bad)}.chip.sev-2,.chip.warn{color:var(--warn);border:1px solid var(--warn)}.chip.good{color:var(--good);border:1px solid var(--good)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
details{margin-top:4px}details summary{cursor:pointer;color:var(--muted)}pre{margin:6px 0 0;background:var(--chip);padding:8px;border-radius:6px;white-space:pre-wrap;word-break:break-word;font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0}.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--ink);border-bottom-color:var(--accent)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--good);padding:10px 14px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.15)}.toast.bad{border-left-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:900px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto}nav h3{display:none}.grid2{grid-template-columns:1fr}}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px}
</style>
</head>
<body>
<header>
  <h1>Supermortgage <span>ops console</span></h1>
  <div class="actor">
    <span id="who" hidden></span>
    <label id="legacyActor" hidden>Acting as <input id="actorId" size="14" placeholder="user id"></label>
    <select id="actorRole" title="the role this request acts under (34.1 rule 3)"></select>
    <span id="readonly" class="chip" hidden>read-only</span>
    <button id="signout" class="ghost" hidden>Sign out</button>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>
<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const state = { view: "dashboard", kind: null, loanId: null, tab: "events", roles: [], readOnly: false, counts: {}, me: null, staff: true, door: { step: "email", email: "", token: null, hasPassword: false, fakeCode: null, returnTo: null }, apiBase: location.pathname.startsWith("/ops") ? "/ops/api" : "/api" };
const STAFF_ROLES = ["ops_analyst", "officer", "compliance", "admin"];
const KINDS = [["queue", "My queue"], ["escalation", "Escalations"], ["portal_task", "Portal tasks"], ["held_notice", "Held notices"], ["dead_letter", "Dead letters"], ["breached_timer", "Breached timers"]];
const money = (c) => { const n = BigInt(c); const neg = n < 0n; const a = neg ? -n : n; return (neg ? "-$" : "$") + (a / 100n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + (a % 100n).toString().padStart(2, "0"); };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = (iso) => iso ? new Date(iso).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }) : "";
/** 34.1 rule 3: the actor is the session's; the role picker chooses among the roles the session holds. Without a staff runtime (npm run console --demo) the legacy header actor picker stands in. */
function actor() { if (state.me && state.me.source === "session") return { id: state.me.staff_user_id, role: $("#actorRole").value || state.me.role }; return { id: $("#actorId").value.trim() || "ops-user", role: $("#actorRole").value }; }
/** `opts.role` names the role an act runs under (34.1 rule 3: an unmask as compliance, a resolve as ops_analyst) when it differs from the picker's; every refusal surfaces as `CODE: reason` text. */
async function api(path, opts = {}) {
  const a = actor();
  const form = typeof FormData !== "undefined" && opts.body instanceof FormData;   // a multipart upload sets its own content-type (boundary)
  const url = path.startsWith("/api/") ? state.apiBase + path.slice(4) : path;
  const role = opts.role || a.role;
  const headers = { ...(form ? {} : { "content-type": "application/json" }), ...(state.staff ? { "x-staff-role": role } : { "x-actor-id": a.id, "x-actor-role": role }), ...(opts.headers || {}) };
  const res = await fetch(url, { ...opts, credentials: "same-origin", headers });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && state.staff && (data.code === "AUTH_REQUIRED" || data.code === "SESSION_EXPIRED")) { door(data.code === "SESSION_EXPIRED" ? "Your session ended (30 minutes idle or 12 hours). Sign in again; you will return to where you were." : null); throw new Error(data.code); }
  if (!res.ok) { const err = new Error(data.code ? `${data.code}: ${data.reason || (data.error !== String(data.code).toLowerCase() && data.error) || res.statusText}${data.role ? ` (needs ${data.role})` : ""}` : data.error || data.reason || res.statusText); err.code = data.code || null; err.status = res.status; err.data = data; throw err; }
  return data;
}
/** The first of `roles` the session holds (the role an act is sent under), else the picker's role — the server refuses with ROLE_REQUIRED when none is held. */
const roleFor = (...roles) => roles.find((x) => holds(x)) || actor().role;
const opsRole = () => holds("ops_analyst") || holds("officer") || holds("compliance") || !state.staff;
const short = (id) => (id ? `<span class="mono" title="${esc(id)}">${esc(String(id)).slice(0, 8)}…</span>` : "—");
const mono = (s) => (s === null || s === undefined || s === "" ? "—" : `<span class="mono">${esc(s)}</span>`);
const dash = (v) => (v === null || v === undefined || v === "" ? "—" : esc(v));
const cents = (c) => (c === null || c === undefined || c === "" ? "—" : money(c));
const pct = (p) => (p === null || p === undefined || p === "" ? "—" : `${esc(p)}%`);
const yesno = (b) => (b === null || b === undefined ? "—" : b ? "yes" : "no");
const list = (a) => (Array.isArray(a) && a.length ? esc(a.join(", ")) : "—");
const jsonDetails = (label, v) => `<details><summary>${esc(label)}</summary><pre>${esc(JSON.stringify(v, null, 1))}</pre></details>`;
const kv = (pairs) => `<table><tbody>${pairs.map(([k, v]) => `<tr><th style="width:220px">${k}</th><td>${v}</td></tr>`).join("")}</tbody></table>`;
/** A refusal or an outcome rendered as text where the control sits — the code first, never swallowed into a toast alone. */
const line = (el, text, bad) => { if (!el) return; el.innerHTML = `<span class="chip ${bad ? "bad" : "good"}">${esc(text)}</span>`; };
const stateChip = (s, good = [], bad = []) => `<span class="chip ${good.includes(s) ? "good" : bad.includes(s) ? "bad" : ""}">${esc(s)}</span>`;
const tabsOf = (tabs, current) => `<div class="tabs">${tabs.map(([k, t]) => `<button data-tab="${k}" class="${current === k ? "active" : ""}">${t}</button>`).join("")}</div>`;
/** The door (34.1 rule 1): e-mail → a code by e-mail → a password (set at enrolment) → the session; the view the user was on is kept as the return path. */
function door(message) {
  if (state.view !== "door") state.door.returnTo = { view: state.view, kind: state.kind, loanId: state.loanId, importId: state.importId };
  state.view = "door"; state.me = null; state.door.step = "email"; state.door.token = null; state.door.message = message || null;
  $("#nav").hidden = true; $("#who").hidden = true; $("#signout").hidden = true; $("#actorRole").hidden = true;
  render();
}
async function doorSubmit(step, f) {
  const v = (n) => (f.querySelector(`[name="${n}"]`) || { value: "" }).value.trim();
  if (step === "email") { const r = await api("/api/auth/code", { method: "POST", body: JSON.stringify({ email: v("email") }) }); state.door.email = v("email"); state.door.fakeCode = r.fake_code || null; state.door.step = "code"; }
  else if (step === "code") { const r = await api("/api/auth/verify", { method: "POST", body: JSON.stringify({ email: state.door.email, code: v("code") }) }); state.door.token = r.token; state.door.hasPassword = !!r.has_password; state.door.step = r.has_password && !state.door.reset ? "password" : "set_password"; }
  else if (step === "set_password") { if (v("password") !== v("password2")) throw new Error("the two passwords differ"); await api("/api/auth/password", { method: "POST", body: JSON.stringify({ token: state.door.token, password: v("password"), ...(state.door.hasPassword ? { current_password: v("current_password") } : {}) }) }); state.door.reset = false; state.door.step = "password"; toast("Password set — now sign in with it"); }
  else if (step === "password") {
    const r = await api("/api/auth/signin", { method: "POST", body: JSON.stringify({ email: state.door.email, password: v("password") }) });
    state.door.token = null; state.door.fakeCode = null; state.door.step = "email";
    const back = state.door.returnTo || { view: "dashboard" }; state.door.returnTo = null;
    Object.assign(state, { view: back.view === "door" ? "dashboard" : back.view, kind: back.kind || null, loanId: back.loanId || null, importId: back.importId || null });
    await whoami(); toast(`Signed in as ${r.legal_name || r.staff_user_id.slice(0, 8)} (${r.factors.join(" + ")})`); await refreshCounts(); render(); return;
  }
  render();
}
function doorView() {
  const d = state.door; const fake = d.fakeCode ? `<p class="muted">FAKE e-mail (non-production): the code is <b class="mono">${esc(d.fakeCode)}</b></p>` : "";
  const box = (inner) => `<div style="max-width:420px;margin:60px auto"><h2>Sign in <span class="muted">— operator portal</span></h2>${d.message ? `<p class="chip warn">${esc(d.message)}</p>` : ""}<div class="tile">${inner}</div><p class="muted">Two factors, always: a code to your e-mail (or a passkey) and your password. Every action is recorded with your name and role.</p></div>`;
  if (d.step === "email") return box(`<form data-door="email"><p>Enter your staff e-mail; a code will be sent to it.</p><div class="row"><input name="email" type="email" placeholder="you@supermortgage" size="30" required autofocus><button class="primary" type="submit">Send code</button></div></form>`);
  if (d.step === "code") return box(`<form data-door="code"><p>Enter the six-digit code sent to <span class="mono">${esc(d.email)}</span>.</p>${fake}<div class="row"><input name="code" inputmode="numeric" pattern="[0-9]{6}" placeholder="000000" size="10" required autofocus><button class="primary" type="submit">Verify</button></div><p class="muted"><a href="#" data-door-back>Use another e-mail</a></p></form>`);
  if (d.step === "set_password") return box(`<form data-door="set_password"><p>${d.hasPassword ? "Choose a new password" : "Welcome — set your password"} (at least 12 characters; common and breached passwords are refused).</p>${d.hasPassword ? `<p class="muted">A reset needs a second proof the mailbox does not give: your current password, or a passkey asserted in the last 10 minutes. Without either, ask an admin to re-invite you.</p><div class="row"><input name="current_password" type="password" placeholder="current password (or leave empty after a passkey assertion)" size="30"></div>` : ""}<div class="row"><input name="password" type="password" placeholder="password" size="30" minlength="12" required autofocus></div><div class="row"><input name="password2" type="password" placeholder="repeat the password" size="30" minlength="12" required><button class="primary" type="submit">Set password</button></div></form>`);
  return box(`<form data-door="password"><p>The code checked out. Now your password.</p><div class="row"><input name="password" type="password" placeholder="password" size="30" required autofocus><button class="primary" type="submit">Sign in</button></div><p class="muted"><a href="#" data-door-reset>Reset it (the code you verified, plus your current password or a passkey)</a></p></form>`);
}
async function whoami() {
  const me = await api("/api/me"); state.me = me; state.readOnly = !!me.readOnly;
  const sel = $("#actorRole"); sel.innerHTML = (me.roles || []).map((x) => `<option ${x === me.role ? "selected" : ""}>${x}</option>`).join(""); sel.hidden = false;
  if (me.source === "session") { $("#who").textContent = `${me.legal_name || me.staff_user_id.slice(0, 8)} · ${(me.session && me.session.factors || []).join(" + ")}`; $("#who").hidden = false; $("#signout").hidden = false; $("#legacyActor").hidden = true; }
  else { $("#who").hidden = true; $("#signout").hidden = true; $("#legacyActor").hidden = false; }
  $("#readonly").hidden = !state.readOnly; $("#nav").hidden = false;
  return me;
}
const holds = (role) => !!(state.me && (state.me.roles || []).includes(role));
function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => (t.hidden = true), 3500); }
function nav() {
  const n = $("#nav"); const c = state.counts;
  n.innerHTML = `<h3>Work</h3>` + KINDS.map(([k, label]) => `<a href="#" data-view="${k === "queue" ? "queue" : "kind"}" data-kind="${k}" class="${(state.view === "queue" && k === "queue") || (state.view === "kind" && state.kind === k) ? "active" : ""}">${label}<span class="count">${k === "queue" ? "" : (c[k] ?? "")}</span></a>`).join("")
    // 34.2 the directory and 34.3 the book are the ops roles' (ops_analyst | officer | compliance — 34.1 rule 2: admin touches no borrower); 34.4 controls read for every role, evidence for compliance | admin
    + `<h3>Records</h3><a href="#" data-view="loans" class="${state.view === "loans" || state.view === "loan" ? "active" : ""}">Loans</a>${opsRole() ? `<a href="#" data-view="directory" class="${state.view.startsWith("directory") ? "active" : ""}">Directory</a><a href="#" data-view="book" class="${state.view.startsWith("book") ? "active" : ""}">Book</a>` : ""}<h3>Oversight</h3><a href="#" data-view="dashboard" class="${state.view === "dashboard" ? "active" : ""}">Compliance Sentinel</a><a href="#" data-view="controls" class="${state.view.startsWith("controls") ? "active" : ""}">Controls</a>${holds("admin") ? `<a href="#" data-view="staff" class="${state.view === "staff" ? "active" : ""}">Staff &amp; roles</a>` : ""}${holds("compliance") || holds("admin") ? `<a href="#" data-view="access_review" class="${state.view === "access_review" ? "active" : ""}">Access review</a>` : ""}<a href="#" data-view="agents" class="${state.view === "agents" ? "active" : ""}">Agents &amp; AI path</a><a href="#" data-view="ai" class="${state.view === "ai" || state.view === "ai_party" ? "active" : ""}">AI conversations</a>`;
  n.querySelectorAll("a").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); state.view = a.dataset.view; state.kind = a.dataset.kind || null; render(); }));
}
async function refreshCounts() { try { const d = await api("/api/dashboard"); state.counts = d.queues; state.dash = d; } catch (e) { /* unauthenticated until a role is chosen */ } nav(); }
function actionsFor(item) {
  if (state.readOnly) return `<span class="muted">read-only</span>`;
  switch (item.kind) {
    case "escalation": return `<button class="primary" data-act="escalation" data-id="${item.id}">Complete with evidence</button>`;
    case "portal_task": return `<button class="primary" data-act="portal_task" data-id="${item.id}">Mark completed</button>`;
    case "held_notice": return `<button class="primary" data-act="held_notice" data-id="${item.id}">Supersede with corrected notice</button>`;
    case "dead_letter": return `<button class="primary" data-act="dead_letter" data-id="${item.id}">Requeue</button>`;
    default: return `<span class="muted">work the loan</span>`;
  }
}
async function act(btn) {
  const id = btn.dataset.id; const kind = btn.dataset.act;
  try {
    if (kind === "escalation") { const ev = prompt("Evidence document id (required for a completed escalation):"); if (ev === null) return; await api("/api/escalations/complete", { method: "POST", body: JSON.stringify({ id, evidenceDocumentId: ev || null }) }); }
    if (kind === "portal_task") { const ev = prompt("Confirmation / evidence document id:"); if (ev === null) return; await api("/api/portal-tasks/complete", { method: "POST", body: JSON.stringify({ id, evidenceDocumentId: ev || null }) }); }
    if (kind === "held_notice") { const r = prompt("Id of the corrected notice that supersedes this one:"); if (!r) return; await api("/api/notices/supersede", { method: "POST", body: JSON.stringify({ id, replacementId: r }) }); }
    if (kind === "dead_letter") await api("/api/outbox/requeue", { method: "POST", body: JSON.stringify({ id }) });
    toast("Done — recorded as " + actor().role + ":" + actor().id); await refreshCounts(); render();
  } catch (e) { toast(e.message, true); }
}
function queueTable(items) {
  if (!items.length) return `<div class="empty">Nothing in this queue.</div>`;
  return `<table><thead><tr><th>Opened</th><th>Item</th><th>Owner</th><th>Loan</th><th>Detail</th><th></th></tr></thead><tbody>` + items.map((i) => `<tr><td class="muted">${when(i.openedAt)}${i.dueAt ? `<br><span class="chip warn">due ${when(i.dueAt)}</span>` : ""}</td><td><b>${esc(i.title)}</b><br><span class="chip">${i.kind.replace("_", " ")}</span> ${i.severity ? `<span class="chip ${esc(i.severity)}">${esc(i.severity)}</span>` : ""}</td><td>${esc(i.ownerRole)}</td><td>${i.loanId ? `<a href="#" data-loan="${esc(i.loanId)}" class="mono">${esc(i.loanId).slice(0, 8)}…</a>` : "—"}</td><td><details><summary>detail</summary><pre>${esc(JSON.stringify(i.detail, null, 1))}</pre></details></td><td>${actionsFor(i)}</td></tr>`).join("") + `</tbody></table>`;
}
async function render() {
  nav(); const m = $("#main");
  try {
    if (state.view === "door") {
      m.innerHTML = doorView();
      m.querySelectorAll("form[data-door]").forEach((f) => f.addEventListener("submit", async (e) => { e.preventDefault(); const b = f.querySelector("button"); b.disabled = true; try { await doorSubmit(f.dataset.door, f); } catch (err) { toast(err.message, true); b.disabled = false; } }));
      const back = m.querySelector("[data-door-back]"); if (back) back.addEventListener("click", (e) => { e.preventDefault(); state.door.step = "email"; render(); });
      const reset = m.querySelector("[data-door-reset]"); if (reset) reset.addEventListener("click", (e) => { e.preventDefault(); state.door.reset = true; state.door.step = "set_password"; render(); });
      return;
    }
    if (state.view === "staff") {
      // 34.1 rule 2 (admin): invite by e-mail, the roles, disable — each a bus command (staff.invite, staff.role.set, staff.disable) with this admin as actor and a decision record with the rationale
      const r = await api("/api/staff");
      const roleBoxes = (u) => STAFF_ROLES.map((x) => `<label><input type="checkbox" data-role-of="${esc(u.staff_user_id)}" value="${x}" ${u.roles.includes(x) ? "checked" : ""} ${u.status === "disabled" ? "disabled" : ""}> ${x}</label>`).join(" ");
      m.innerHTML = `<h2>Staff &amp; roles <span class="muted">— as of ${when(r.as_of)}</span></h2>
        <form id="invite" class="row"><input name="email" type="email" placeholder="colleague@supermortgage" size="28" required><input name="legal_name" placeholder="Legal name" size="18">${STAFF_ROLES.map((x) => `<label><input type="checkbox" name="roles" value="${x}" ${x === "ops_analyst" ? "checked" : ""}> ${x}</label>`).join(" ")}<button class="primary" type="submit">Invite</button></form>
        <p class="muted">The invitation goes by e-mail (NTC_SM_STAFF_INVITATION): the inviter's name, the roles, the sign-in address, "a code will be sent to this e-mail". The address itself is stored hashed and encrypted and appears nowhere else.</p>`

  const cf = $("#cf"); if (cf) cf.addEventListener("submit", (e) => { e.preventDefault(); state.cf = { status: cf.status.value, code: cf.code.value.trim(), subject: cf.subject.value.trim(), due_before: cf.due_before.value }; render(); });

}
async function renderClock(m) {

    + `<h2>History (${(t.history || []).length})</h2>` + table((t.history || []).map((h) => [when(h.occurred_at), esc(h.type), short(h.id), jsonDetails("payload", h.payload)]), ["At", "Event", "Id", ""]);
  m.querySelectorAll("[data-view-back]").forEach((x) => x.addEventListener("click", (e) => { e.preventDefault(); state.view = x.dataset.viewBack; render(); }));

async function renderPack(m) {
  const p = await api(`/api/controls/evidence/${encodeURIComponent(state.packId)}${state.verifyPack === state.packId ? "?verify=1" : ""}`, { role: roleFor("compliance") }); const man = p.manifest || {}; const ver = p.verification;
  m.innerHTML = `<h2>Evidence pack <span class="mono">${esc(String(p.id)).slice(0, 8)}…</span></h2><p class="muted"><a href="#" data-view-back="controls">← controls</a> · ${esc(p.id)}</p>`
    + kv([["Subject", `${esc(p.subject_kind)} ${p.subject_id ? mono(p.subject_id) : ""}${p.from_date ? ` ${esc(p.from_date)} → ${esc(p.to_date)}` : ""}`], ["Produced", `${when(p.created_at)} by ${p.produced_by ? mono(p.produced_by) : "—"} (${esc(man.produced_role || "")})`], ["sha256", mono(p.sha256)], ["Document", `${p.document_id ? mono(p.document_id) : "—"} · ${p.document_available ? "stored" : "content not in this store"}`], ["Sections", list(p.sections)], ["Parts", `${man.part_count ?? "—"} (part size ${man.part_size ?? "—"} events) · sets sha256 ${mono(man.sets_sha256)}`], ["Rule set", dash(man.rule_set_version)]])

/** The guard's verdict on a turn as a chip: `{ok: true}` passes; anything with a rejection or a fallback is flagged. */
function guardChip(g) { const bad = g && (g.ok === false || g.rejected || (Array.isArray(g.failures) && g.failures.length) || g.fallback); return bad ? `<span class="chip warn" title="${esc(JSON.stringify(g))}">rejected</span>` : `<span class="chip good">ok</span>`; }
$("#main").addEventListener("click", (e) => {

function table(rows, headers) { if (!rows.length) return `<div class="empty">None.</div>`; return `<table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`; }
async function boot() {
