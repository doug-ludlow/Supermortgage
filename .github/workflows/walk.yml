name: walk
# The demo walk on demand (docs/ux/18; PLAN §4): the same script deploy.yml runs after every deploy, against the demo as it is now —
# the ten outcomes of apps/borrower/tests/walk/demo-walk.mts on the Apply product. Outcomes 3–5 (the DU moment from the screens, the
# preapproval request, the cash-out refinance) read the application's record through the ops API with the deployed API token: this
# workflow takes it from the repository secret WALK_OPS_TOKEN (Settings → Secrets → Actions; the value of `gcloud secrets versions
# access latest --secret supermortgage-api-token`). When the secret is missing those outcomes fail loudly ("WALK_OPS_TOKEN not
# provided …") — they never pass by default. Outcome 9 needs the partner book a `seed_demo=true` deploy imports.
on:
  workflow_dispatch:
    inputs:
      base:
        description: The demo's base URL
        required: true
        default: https://demo.supermortgage.com
        type: string
permissions:
  contents: read
  id-token: write # the OIDC token Workload Identity Federation exchanges — the log dump below reads Cloud Logging as the deployer
jobs:
  walk:
    name: demo walk (real browser, the Apply product)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/borrower/package-lock.json }
      - name: Install the borrower app's dependencies and Chromium
        working-directory: apps/borrower
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Walk the demo
        working-directory: apps/borrower
        env:
          DEMO_BASE: ${{ inputs.base }}
          WALK_OUT: walk-out
          WALK_OPS_TOKEN: ${{ secrets.WALK_OPS_TOKEN }} # outcomes 3–5; unset → those outcomes are NOT ok by name
        run: |
          echo "WALK_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          node --experimental-strip-types tests/walk/demo-walk.mts
      - name: Keep the screenshots and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-walk
          path: apps/borrower/walk-out
          if-no-files-found: warn
          retention-days: 14
      - name: The demo's log around the walk (only when the walk failed)
        if: failure()
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        # The same dump deploy.yml's walk job makes: the services' and the sweep job's WARNING/ERROR lines, every request answered 500 or
        # more (the services and the load balancer), the borrower API's requests slower than ten seconds, and the INFO lines that carry
        # timings (borrower.card.resolved per tap, borrower.flows.ticked, the sweep's passes) — since WALK_STARTED_AT, ascending.
        run: |
          since="${WALK_STARTED_AT:-$(date -u -d '-20 min' +%Y-%m-%dT%H:%M:%SZ)}"
          read_log() { echo; echo "## $1"; gcloud logging read "$2 AND timestamp>=\"${since}\"" --project "${PROJECT}" --limit "${3:-200}" --order asc --format "$4" 2>&1 || true; }
          read_log "Services and jobs: severity >= WARNING since ${since}" \
            '(resource.type="cloud_run_revision" OR resource.type="cloud_run_job") AND severity>=WARNING' 200 \
            'value(timestamp,severity,resource.labels.service_name,resource.labels.job_name,jsonPayload.message,jsonPayload.error.message,jsonPayload.path,jsonPayload.flow,jsonPayload.events,textPayload)'
          read_log "Requests answered 500 or more (the services and the load balancer) since ${since}" \
            '(resource.type="cloud_run_revision" OR resource.type="http_load_balancer") AND httpRequest.status>=500' 100 \
            'value(timestamp,resource.type,httpRequest.requestMethod,httpRequest.requestUrl,httpRequest.status,httpRequest.latency,jsonPayload.statusDetails)'
          read_log "Borrower API requests slower than 10 s since ${since}" \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="supermortgage-api" AND logName:"requests" AND httpRequest.latency>="10s"' 100 \
            'value(timestamp,httpRequest.requestMethod,httpRequest.requestUrl,httpRequest.status,httpRequest.latency)'
          read_log "Timings: each tap's borrower.card.resolved, borrower.command, borrower.flows.ticked, the sweep's passes since ${since}" \
            '(resource.type="cloud_run_revision" OR resource.type="cloud_run_job") AND (jsonPayload.message="borrower.card.resolved" OR jsonPayload.message="borrower.command" OR jsonPayload.message="borrower.flows.ticked" OR jsonPayload.message="sweep")' 300 \
            'value(timestamp,resource.labels.service_name,resource.labels.job_name,jsonPayload.message,jsonPayload.command,jsonPayload.kind,jsonPayload.events,jsonPayload.ms,jsonPayload.flows,jsonPayload.passes,jsonPayload.outcome)'
